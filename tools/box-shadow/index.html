<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Shadow Generator</title>

<style>
:root {
  --glass-bg: rgba(255,255,255,0.15);
  --glass-border: rgba(255,255,255,0.3);
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff6ec4, #7873f5, #4ade80);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
}

.wrapper {
  display: flex;
  gap: 30px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(14px);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

.preview {
  width: 260px;
  height: 260px;
  background: rgba(255,255,255,0.3);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.controls {
  width: 340px;
}

.control {
  margin-bottom: 14px;
}

.control label {
  display: block;
  font-size: 0.9em;
  margin-bottom: 4px;
}

input[type="range"],
input[type="color"],
input[type="checkbox"] {
  width: 100%;
}

.code-box {
  background: rgba(0,0,0,0.35);
  padding: 10px;
  border-radius: 10px;
  font-family: monospace;
  font-size: 0.85em;
  word-break: break-all;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  background: #fff;
  color: #333;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="preview" id="previewBox">
    Preview
  </div>

  <div class="controls">

    <div class="control">
      <label>X Offset</label>
      <input type="range" id="xOffset" min="-50" max="50" value="10">
    </div>

    <div class="control">
      <label>Y Offset</label>
      <input type="range" id="yOffset" min="-50" max="50" value="10">
    </div>

    <div class="control">
      <label>Blur Radius</label>
      <input type="range" id="blur" min="0" max="100" value="20">
    </div>

    <div class="control">
      <label>Spread Radius</label>
      <input type="range" id="spread" min="-50" max="50" value="0">
    </div>

    <div class="control">
      <label>Shadow Color</label>
      <input type="color" id="shadowColor" value="#000000">
    </div>

    <div class="control">
      <label>Shadow Opacity</label>
      <input type="range" id="opacity" min="0" max="1" step="0.01" value="0.3">
    </div>

    <div class="control">
      <label>
        <input type="checkbox" id="inset"> Inset Shadow
      </label>
    </div>

    <div class="code-box" id="cssOutput"></div>
    <button id="copyBtn">Copy CSS</button>

  </div>
</div>

<script>
const preview = document.getElementById("previewBox");
const xOffset = document.getElementById("xOffset");
const yOffset = document.getElementById("yOffset");
const blur = document.getElementById("blur");
const spread = document.getElementById("spread");
const shadowColor = document.getElementById("shadowColor");
const opacity = document.getElementById("opacity");
const inset = document.getElementById("inset");
const cssOutput = document.getElementById("cssOutput");
const copyBtn = document.getElementById("copyBtn");

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function updateShadow() {
  const rgba = hexToRgba(shadowColor.value, opacity.value);
  const insetValue = inset.checked ? "inset " : "";
  const shadow = `${insetValue}${xOffset.value}px ${yOffset.value}px ${blur.value}px ${spread.value}px ${rgba}`;

  preview.style.boxShadow = shadow;
  cssOutput.textContent = `box-shadow: ${shadow};`;
}

document.querySelectorAll("input").forEach(input =>
  input.addEventListener("input", updateShadow)
);

copyBtn.addEventListener("click", () => {
  navigator.clipboard.writeText(cssOutput.textContent);
  copyBtn.textContent = "Copied!";
  setTimeout(() => copyBtn.textContent = "Copy CSS", 1500);
});

updateShadow();
</script>

</body>
</html>
