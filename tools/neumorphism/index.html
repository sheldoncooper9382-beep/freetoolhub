<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neumorphism Generator – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* =========================
   FreeToolHub Theme
========================= */
:root {
  --accent: #7dd3fc;
  --accent2: #a855f7;
  --text: #e5e7eb;
}

* {
  box-sizing: border-box;
  font-family: system-ui, Segoe UI, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #1e293b;
  color: var(--text);
}

/* =========================
   Layout
========================= */
.app {
  width: 1000px;
  max-width: 96%;
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 20px;
}

/* =========================
   Panels
========================= */
.panel {
  padding: 22px;
  border-radius: 22px;
  background: #1e293b;
  box-shadow:
    10px 10px 20px rgba(0,0,0,0.45),
    -10px -10px 20px rgba(255,255,255,0.04);
}

h2 {
  margin-top: 0;
  font-size: 1.25rem;
}

/* =========================
   Controls
========================= */
.control {
  margin-bottom: 14px;
}

label {
  font-size: 0.75rem;
  opacity: 0.85;
}

input[type="range"],
input[type="color"],
select {
  width: 100%;
  margin-top: 6px;
}

/* =========================
   Preview Area
========================= */
.preview-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.preview-bg {
  width: 100%;
  padding: 60px;
  border-radius: 20px;
  background: #1e293b;
}

/* =========================
   Neumorphic Element
========================= */
.neu-preview {
  width: 320px;
  height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 22px;
  font-weight: 700;
  transition: all 0.15s ease;
}

/* =========================
   Output
========================= */
pre {
  width: 100%;
  background: #020617;
  padding: 14px;
  border-radius: 14px;
  overflow-x: auto;
  font-size: 0.85rem;
}

/* =========================
   Buttons
========================= */
.actions {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #020617;
}
</style>
</head>

<body>

<div class="app">

  <!-- LEFT PANEL -->
  <div class="panel">
    <h2>🧈 Neumorphism Controls</h2>

    <div class="control">
      <label>Base Color</label>
      <input type="color" id="base" value="#1e293b">
    </div>

    <div class="control">
      <label>Depth</label>
      <input type="range" id="depth" min="0" max="40" value="20">
    </div>

    <div class="control">
      <label>Blur</label>
      <input type="range" id="blur" min="0" max="40" value="30">
    </div>

    <div class="control">
      <label>Intensity</label>
      <input type="range" id="intensity" min="0" max="1" step="0.01" value="0.4">
    </div>

    <div class="control">
      <label>Border Radius</label>
      <input type="range" id="radius" min="0" max="40" value="22">
    </div>

    <div class="control">
      <label>Style</label>
      <select id="style">
        <option value="raised">Raised</option>
        <option value="inset">Inset</option>
      </select>
    </div>

    <div class="control">
      <label>Text Color</label>
      <input type="color" id="textColor" value="#e5e7eb">
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel preview-wrap">
    <h2>👀 Live Preview</h2>

    <div class="preview-bg">
      <div class="neu-preview" id="neu">
        Neumorphic UI
      </div>
    </div>

    <h2>📄 CSS Output</h2>
    <pre id="cssOutput"></pre>

    <div class="actions">
      <button onclick="copyCSS()">Copy CSS</button>
      <button onclick="copyHTML()">Copy HTML</button>
    </div>
  </div>

</div>

<script>
const neu = document.getElementById("neu");
const cssOutput = document.getElementById("cssOutput");

function update() {
  const base = document.getElementById("base").value;
  const depth = +document.getElementById("depth").value;
  const blur = +document.getElementById("blur").value;
  const intensity = +document.getElementById("intensity").value;
  const radius = document.getElementById("radius").value;
  const style = document.getElementById("style").value;
  const textColor = document.getElementById("textColor").value;

  neu.style.background = base;
  neu.style.borderRadius = radius + "px";
  neu.style.color = textColor;

  const light = `rgba(255,255,255,${intensity})`;
  const dark = `rgba(0,0,0,${intensity})`;

  neu.style.boxShadow =
    style === "raised"
      ? `
        ${depth}px ${depth}px ${blur}px ${dark},
        -${depth}px -${depth}px ${blur}px ${light}
      `
      : `
        inset ${depth}px ${depth}px ${blur}px ${dark},
        inset -${depth}px -${depth}px ${blur}px ${light}
      `;

  cssOutput.textContent = `
background: ${base};
border-radius: ${radius}px;
box-shadow:
  ${style === "raised"
    ? `${depth}px ${depth}px ${blur}px ${dark},
  -${depth}px -${depth}px ${blur}px ${light}`
    : `inset ${depth}px ${depth}px ${blur}px ${dark},
  inset -${depth}px -${depth}px ${blur}px ${light}`};
color: ${textColor};
`.trim();
}

function copyCSS() {
  navigator.clipboard.writeText(cssOutput.textContent);
}

function copyHTML() {
  navigator.clipboard.writeText(
    `<div style="${neu.style.cssText}">Neumorphic UI</div>`
  );
}

document.querySelectorAll("input, select").forEach(el =>
  el.addEventListener("input", update)
);

update();
</script>

</body>
</html>
