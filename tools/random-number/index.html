<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random Number Generator – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --glass-bg: rgba(255,255,255,0.22);
  --glass-border: rgba(255,255,255,0.45);
  --accent: #22f0ff;        /* neon cyan */
  --accent-2: #c084fc;     /* neon purple */
  --text: #f8fafc;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at top left, #1e293b, #020617),
    radial-gradient(circle at bottom right, #3b0764, transparent);
  color: var(--text);
}

.glass {
  width: 460px;
  padding: 28px;
  border-radius: 22px;
  background: var(--glass-bg);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid var(--glass-border);
  box-shadow:
    0 25px 50px rgba(0,0,0,0.45),
    inset 0 0 0 1px rgba(255,255,255,0.15);
}

h1 {
  margin: 0 0 18px;
  text-align: center;
  font-size: 1.55rem;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  color: transparent;
}

.controls {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.control {
  background: rgba(255,255,255,0.28);
  padding: 12px;
  border-radius: 16px;
}

label {
  font-size: 0.75rem;
  opacity: 0.9;
}

input[type="number"] {
  width: 100%;
  margin-top: 6px;
  padding: 10px;
  border-radius: 12px;
  border: none;
  outline: none;
  background: rgba(0,0,0,0.25);
  color: white;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
}

.options {
  grid-column: span 2;
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
}

.options label {
  font-size: 0.8rem;
  cursor: pointer;
}

.output {
  margin-top: 18px;
  padding: 16px;
  min-height: 100px;
  border-radius: 16px;
  background: rgba(0,0,0,0.35);
  overflow-wrap: anywhere;
  font-family: monospace;
  font-size: 0.95rem;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.15),
    0 0 18px rgba(34,240,255,0.15);
}

.actions {
  margin-top: 16px;
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  padding: 13px;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #020617;
  box-shadow:
    0 0 18px rgba(34,240,255,0.45),
    0 10px 30px rgba(0,0,0,0.4);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:hover {
  transform: translateY(-2px);
  box-shadow:
    0 0 28px rgba(34,240,255,0.75),
    0 16px 40px rgba(0,0,0,0.5);
}

button.secondary {
  background: linear-gradient(135deg, #e5e7eb, #cbd5f5);
  box-shadow: 0 0 12px rgba(192,132,252,0.4);
}
</style>
</head>

<body>

<div class="glass">
  <h1>🎲 Random Number Generator</h1>

  <div class="controls">
    <div class="control">
      <label>How Many Numbers</label>
      <input type="number" id="count" value="5" min="1" max="100">
    </div>

    <div class="control">
      <label>Digits per Number</label>
      <input type="number" id="digits" value="4" min="1" max="12">
    </div>

    <div class="options">
      <label>
        <input type="checkbox" id="unique"> No duplicates
      </label>
      <label>
        <input type="checkbox" id="sort"> Sort results
      </label>
    </div>
  </div>

  <div class="output" id="output"></div>

  <div class="actions">
    <button onclick="generate()">Generate</button>
    <button class="secondary" onclick="copyAll()">Copy</button>
  </div>
</div>

<script>
function randomNumber(digits) {
  const min = Math.pow(10, digits - 1);
  const max = Math.pow(10, digits) - 1;
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generate() {
  const count = +document.getElementById("count").value;
  const digits = +document.getElementById("digits").value;
  const unique = document.getElementById("unique").checked;
  const sort = document.getElementById("sort").checked;
  const output = document.getElementById("output");

  let numbers = new Set();

  while (numbers.size < count) {
    numbers.add(randomNumber(digits));
    if (!unique && numbers.size >= count) break;
  }

  let result = unique ? Array.from(numbers) : [];
  if (!unique) {
    for (let i = 0; i < count; i++) result.push(randomNumber(digits));
  }

  if (sort) result.sort((a, b) => a - b);

  output.textContent = result.join(", ");
}

function copyAll() {
  const text = document.getElementById("output").textContent;
  if (text) navigator.clipboard.writeText(text);
}

generate();
</script>

</body>
</html>
