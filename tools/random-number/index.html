<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random Number Generator – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --glass-bg: rgba(255,255,255,0.15);
  --glass-border: rgba(255,255,255,0.25);
  --accent: #7dd3fc;
  --text: #ffffff;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top left, #0f172a, #020617);
  color: var(--text);
}

.glass {
  width: 460px;
  padding: 28px;
  border-radius: 20px;
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  box-shadow: 0 20px 40px rgba(0,0,0,0.35);
}

h1 {
  margin: 0 0 16px;
  text-align: center;
  font-size: 1.5rem;
}

.controls {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.control {
  background: rgba(255,255,255,0.2);
  padding: 10px;
  border-radius: 14px;
}

label {
  font-size: 0.75rem;
  opacity: 0.85;
}

input[type="number"] {
  width: 100%;
  margin-top: 6px;
  padding: 8px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.25);
  color: white;
}

.options {
  grid-column: span 2;
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
}

.options label {
  font-size: 0.8rem;
  cursor: pointer;
}

.output {
  margin-top: 16px;
  padding: 14px;
  min-height: 100px;
  border-radius: 14px;
  background: rgba(255,255,255,0.15);
  overflow-wrap: anywhere;
  font-family: monospace;
  font-size: 0.9rem;
}

.actions {
  margin-top: 14px;
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  background: var(--accent);
  color: #020617;
}

button.secondary {
  background: rgba(255,255,255,0.6);
}
</style>
</head>

<body>

<div class="glass">
  <h1>🎲 Random Number Generator</h1>

  <div class="controls">
    <div class="control">
      <label>How Many Numbers</label>
      <input type="number" id="count" value="5" min="1" max="100">
    </div>

    <div class="control">
      <label>Digits per Number</label>
      <input type="number" id="digits" value="4" min="1" max="12">
    </div>

    <div class="options">
      <label>
        <input type="checkbox" id="unique"> No duplicates
      </label>
      <label>
        <input type="checkbox" id="sort"> Sort results
      </label>
    </div>
  </div>

  <div class="output" id="output"></div>

  <div class="actions">
    <button onclick="generate()">Generate</button>
    <button class="secondary" onclick="copyAll()">Copy</button>
  </div>
</div>

<script>
function randomNumber(digits) {
  const min = Math.pow(10, digits - 1);
  const max = Math.pow(10, digits) - 1;
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generate() {
  const count = +document.getElementById("count").value;
  const digits = +document.getElementById("digits").value;
  const unique = document.getElementById("unique").checked;
  const sort = document.getElementById("sort").checked;
  const output = document.getElementById("output");

  let numbers = new Set();

  while (numbers.size < count) {
    if (!unique && numbers.size >= count) break;
    numbers.add(randomNumber(digits));
    if (!unique && numbers.size >= count) break;
  }

  let result = Array.from(numbers);
  if (!unique) {
    result = [];
    for (let i = 0; i < count; i++) result.push(randomNumber(digits));
  }

  if (sort) result.sort((a, b) => a - b);

  output.textContent = result.join(", ");
}

function copyAll() {
  const text = document.getElementById("output").textContent;
  if (text) navigator.clipboard.writeText(text);
}

generate();
</script>

</body>
</html>
