<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sudoku Theme Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <h1>Sudoku Theme Generator</h1>
  <p class="subtitle">Design custom Sudoku grid styles in real time</p>

  <div class="layout">

    <!-- CONTROLS -->
    <div class="panel">
      <label>
        Cell Background
        <input type="color" id="cellBg" value="#3a176d">
      </label>

      <label>
        Grid Line Color
        <input type="color" id="gridLine" value="#ffffff">
      </label>

      <label>
        Text Color
        <input type="color" id="textColor" value="#ffffff">
      </label>

      <label>
        Thick Line Size
        <input type="range" id="thickSize" min="2" max="8" value="4">
      </label>

      <button class="btn glass">Glass</button>
      <button class="btn neon">Neon</button>
      <button class="btn minimal">Minimal</button>
      <button class="btn export">Export CSS</button>
    </div>

    <!-- SUDOKU GRID -->
    <div class="sudoku-wrap">
      <table class="sudoku">
        <tbody>
          <!-- 9x9 -->
          <!-- Numbers are placeholders -->
          <!-- JS-ready -->
          <script>
            for (let r = 0; r < 9; r++) {
              document.write("<tr>");
              for (let c = 1; c <= 9; c++) {
                document.write(`<td>${c}</td>`);
              }
              document.write("</tr>");
            }
          </script>
        </tbody>
      </table>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
