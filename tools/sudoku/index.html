<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sudoku Theme Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <h1>Sudoku Theme Generator</h1>
    <p class="subtitle">Design custom Sudoku grid styles in real time</p>

    <div class="layout">
      <!-- CONTROLS -->
      <div class="panel">
        <label>
          Cell Background
          <input type="color" value="#2b0a52">
        </label>

        <label>
          Grid Line Color
          <input type="color" value="#cfc3ff">
        </label>

        <label>
          Thick Line Size
          <input type="range" min="2" max="6" value="4">
        </label>

        <button class="btn glass">Glass</button>
        <button class="btn neon">Neon</button>
        <button class="btn minimal">Minimal</button>
        <button class="btn export">Export CSS</button>
      </div>
