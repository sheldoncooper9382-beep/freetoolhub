<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Animation Generator – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* =========================
   FreeToolHub Glass Theme
========================= */
:root {
  --glass-bg: rgba(255,255,255,0.14);
  --glass-border: rgba(255,255,255,0.28);
  --accent: #7dd3fc;
  --accent2: #a855f7;
  --text: #f8fafc;
}

* {
  box-sizing: border-box;
  font-family: system-ui, Segoe UI, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top left, #1e293b, #020617);
  color: var(--text);
}

/* =========================
   Layout
========================= */
.app {
  width: 1050px;
  max-width: 96%;
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 20px;
}

/* =========================
   Glass Panels
========================= */
.panel {
  padding: 22px;
  border-radius: 22px;
  background: linear-gradient(
    145deg,
    rgba(255,255,255,0.22),
    rgba(255,255,255,0.06)
  );
  backdrop-filter: blur(22px);
  border: 1px solid var(--glass-border);
  box-shadow: 0 30px 60px rgba(0,0,0,0.45);
}

h2 {
  margin-top: 0;
  font-size: 1.25rem;
}

/* =========================
   Controls
========================= */
.control {
  margin-bottom: 14px;
}

label {
  font-size: 0.75rem;
  opacity: 0.85;
}

select,
input[type="range"],
input[type="number"] {
  width: 100%;
  margin-top: 6px;
}

/* =========================
   Preview Area
========================= */
.preview-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.preview-bg {
  width: 100%;
  padding: 80px;
  border-radius: 20px;
  background: rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
}

.preview-box {
  width: 120px;
  height: 120px;
  border-radius: 22px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #020617;
}

/* =========================
   Output
========================= */
pre {
  width: 100%;
  background: rgba(0,0,0,0.45);
  padding: 14px;
  border-radius: 14px;
  overflow-x: auto;
  font-size: 0.85rem;
}

/* =========================
   Buttons
========================= */
.actions {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #020617;
}
</style>
</head>

<body>

<div class="app">

  <!-- LEFT PANEL -->
  <div class="panel">
    <h2>🎛 Animation Controls</h2>

    <div class="control">
      <label>Animation Type</label>
      <select id="type">
        <option value="fade">Fade</option>
        <option value="slide">Slide</option>
        <option value="scale">Scale</option>
        <option value="rotate">Rotate</option>
        <option value="bounce">Bounce</option>
        <option value="pulse">Pulse</option>
      </select>
    </div>

    <div class="control">
      <label>Duration (s)</label>
      <input type="range" id="duration" min="0.1" max="5" step="0.1" value="1">
    </div>

    <div class="control">
      <label>Delay (s)</label>
      <input type="range" id="delay" min="0" max="3" step="0.1" value="0">
    </div>

    <div class="control">
      <label>Timing Function</label>
      <select id="easing">
        <option>ease</option>
        <option>ease-in</option>
        <option>ease-out</option>
        <option>ease-in-out</option>
        <option>linear</option>
        <option>cubic-bezier(0.4,0,0.2,1)</option>
      </select>
    </div>

    <div class="control">
      <label>Iterations</label>
      <select id="iterations">
        <option value="1">1</option>
        <option value="infinite">Infinite</option>
      </select>
    </div>

    <div class="control">
      <label>Direction</label>
      <select id="direction">
        <option>normal</option>
        <option>reverse</option>
        <option>alternate</option>
        <option>alternate-reverse</option>
      </select>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel preview-wrap">
    <h2>👀 Live Preview</h2>

    <div class="preview-bg">
      <div class="preview-box" id="box">Animate</div>
    </div>

    <h2>📄 CSS Output</h2>
    <pre id="cssOutput"></pre>

    <div class="actions">
      <button onclick="restart()">Restart</button>
      <button onclick="copyCSS()">Copy CSS</button>
    </div>
  </div>

</div>

<script>
const box = document.getElementById("box");
const cssOutput = document.getElementById("cssOutput");

function keyframes(type) {
  switch (type) {
    case "fade":
      return `
@keyframes anim {
  from { opacity: 0; }
  to { opacity: 1; }
}`;
    case "slide":
      return `
@keyframes anim {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}`;
    case "scale":
      return `
@keyframes anim {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}`;
    case "rotate":
      return `
@keyframes anim {
  from { transform: rotate(-180deg); }
  to { transform: rotate(0deg); }
}`;
    case "bounce":
      return `
@keyframes anim {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-30px); }
}`;
    case "pulse":
      return `
@keyframes anim {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}`;
  }
}

function update() {
  const t = type.value;
  const d = duration.value;
  const del = delay.value;
  const e = easing.value;
  const i = iterations.value;
  const dir = direction.value;

  box.style.animation = "none";
  void box.offsetWidth; // reset animation
  box.style.animation = `anim ${d}s ${e} ${del}s ${i} ${dir}`;

  cssOutput.textContent = `
${keyframes(t)}

.element {
  animation: anim ${d}s ${e} ${del}s ${i} ${dir};
}
`.trim();
}

function restart() {
  update();
}

function copyCSS() {
  navigator.clipboard.writeText(cssOutput.textContent);
}

document.querySelectorAll("select, input").forEach(el =>
  el.addEventListener("input", update)
);

update();
</script>

</body>
</html>
