<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>REM to PX Converter – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --glass-bg: rgba(255,255,255,0.14);
  --glass-border: rgba(255,255,255,0.28);
  --accent: #7dd3fc;
  --accent2: #a855f7;
  --text: #f8fafc;
}

* {
  box-sizing: border-box;
  font-family: system-ui, Segoe UI, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top left, #1e293b, #020617);
  color: var(--text);
  padding: 40px 0;
}

/* Layout */
.app {
  width: 1100px;
  max-width: 96%;
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 22px;
}

/* Glass Panels */
.panel {
  padding: 24px;
  border-radius: 22px;
  background: linear-gradient(145deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06));
  backdrop-filter: blur(22px);
  border: 1px solid var(--glass-border);
  box-shadow: 0 30px 60px rgba(0,0,0,0.45);
}

h2 {
  margin-top: 0;
  font-size: 1.25rem;
}

/* Controls */
.control {
  margin-bottom: 14px;
}

label {
  display: block;
  font-size: 0.75rem;
  opacity: 0.85;
  margin-bottom: 4px;
}

input[type="number"], select {
  width: 100%;
  padding: 8px;
  border-radius: 12px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.15);
  color: #fff;
}

/* Preview */
.preview-box {
  margin-top: 20px;
  padding: 40px;
  width: 100%;
  border-radius: 18px;
  background: rgba(255,255,255,0.08);
  text-align: center;
  font-weight: bold;
  font-size: 2rem;
  color: var(--accent2);
}

/* Buttons */
.actions {
  display: flex;
  gap: 12px;
  margin-top: 10px;
}

button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #020617;
}

textarea {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 14px;
  border: none;
  outline: none;
  background: rgba(0,0,0,0.45);
  color: #fff;
  font-family: monospace;
}
</style>
</head>

<body>

<div class="app">

  <!-- LEFT PANEL -->
  <div class="panel">
    <h2>🔁 REM ↔ PX Converter</h2>

    <div class="control">
      <label>Root Font Size (px)</label>
      <input type="number" id="rootSize" value="16">
    </div>

    <div class="control">
      <label>Value</label>
      <input type="number" id="value" value="1">
    </div>

    <div class="control">
      <label>Convert</label>
      <select id="direction">
        <option value="remToPx">REM → PX</option>
        <option value="pxToRem">PX → REM</option>
      </select>
    </div>

    <div class="actions">
      <button id="convertBtn">Convert</button>
      <button onclick="copyCSS()">Copy CSS</button>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel">
    <h2>👀 Result</h2>
    <div class="preview-box" id="preview">16px</div>

    <h2>📄 Generated CSS</h2>
    <textarea id="outputCSS" readonly></textarea>
  </div>

</div>

<script>
const rootInput = document.getElementById("rootSize");
const valueInput = document.getElementById("value");
const directionInput = document.getElementById("direction");
const preview = document.getElementById("preview");
const outputCSS = document.getElementById("outputCSS");
const convertBtn = document.getElementById("convertBtn");

function convertRemPx() {
  const root = parseFloat(rootInput.value);
  const val = parseFloat(valueInput.value);
  const direction = directionInput.value;

  let result, cssString;
  if(direction === "remToPx"){
    result = val * root;
    preview.textContent = `${result.toFixed(2)}px`;
    cssString = `font-size: ${result.toFixed(2)}px; /* ${val}rem */`;
  } else {
    result = val / root;
    preview.textContent = `${result.toFixed(4)}rem`;
    cssString = `font-size: ${result.toFixed(4)}rem; /* ${val}px */`;
  }

  outputCSS.value = cssString;
}

// Copy function
function copyCSS() {
  navigator.clipboard.writeText(outputCSS.value);
}

// Event listeners
convertBtn.addEventListener("click", convertRemPx);
[rootInput, valueInput, directionInput].forEach(el => el.addEventListener("input", convertRemPx));

// Initial conversion
convertRemPx();
</script>

</body>
</html>
