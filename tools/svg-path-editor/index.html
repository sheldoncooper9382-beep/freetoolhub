<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SVG Path Editor – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --glass-bg: rgba(255,255,255,0.14);
  --glass-border: rgba(255,255,255,0.28);
  --accent: #7dd3fc;
  --accent2: #a855f7;
  --text: #f8fafc;
}

* {
  box-sizing: border-box;
  font-family: system-ui, Segoe UI, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background: radial-gradient(circle at top left, #1e293b, #020617);
  color: var(--text);
  padding: 40px 0;
}

/* Layout */
.app {
  width: 1100px;
  max-width: 96%;
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 22px;
}

/* Glass Panels */
.panel {
  padding: 24px;
  border-radius: 22px;
  background: linear-gradient(145deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06));
  backdrop-filter: blur(22px);
  border: 1px solid var(--glass-border);
  box-shadow: 0 30px 60px rgba(0,0,0,0.45);
}

h2 {
  margin-top: 0;
  font-size: 1.25rem;
}

/* Controls */
textarea {
  width: 100%;
  min-height: 120px;
  padding: 12px;
  border-radius: 14px;
  border: none;
  outline: none;
  resize: vertical;
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-family: monospace;
}

/* Buttons */
.actions {
  display: flex;
  gap: 12px;
  margin-top: 10px;
}

button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #020617;
}

/* Preview */
.preview-bg {
  width: 100%;
  padding: 80px;
  border-radius: 22px;
  background: rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
}

.preview-bg svg {
  width: 100%;
  height: 100%;
  max-height: 400px;
}

.control-label {
  font-size: 0.75rem;
  opacity: 0.85;
  margin-bottom: 4px;
  display: block;
}
</style>
</head>

<body>
<div class="app">

  <!-- LEFT PANEL -->
  <div class="panel">
    <h2>✏️ SVG Path Input</h2>
    <label class="control-label">Edit SVG Path</label>
    <textarea id="pathInput" placeholder="e.g. M10 80 C 40 10, 65 10, 95 80 S 150 150, 180 80"></textarea>

    <div class="actions">
      <button id="previewBtn">Preview Path</button>
      <button onclick="copySVG()">Copy SVG Code</button>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel">
    <h2>👀 Live Preview</h2>
    <div class="preview-bg" id="preview"></div>
    <h2>📄 SVG Code</h2>
    <textarea id="svgOutput" readonly></textarea>
  </div>

</div>

<script>
const pathInput = document.getElementById("pathInput");
const preview = document.getElementById("preview");
const svgOutput = document.getElementById("svgOutput");
const previewBtn = document.getElementById("previewBtn");

function updatePreview() {
  const pathData = pathInput.value.trim();
  if (!pathData) return;

  const svgString = `<svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <path d="${pathData}" fill="none" stroke="#7dd3fc" stroke-width="3"/>
  </svg>`;

  // Update live preview
  preview.innerHTML = svgString;

  // Update output code
  svgOutput.value = svgString;
}

// Copy function
function copySVG() {
  navigator.clipboard.writeText(svgOutput.value);
}

// Event listeners
previewBtn.addEventListener("click", updatePreview);
pathInput.addEventListener("input", () => {
  // Optional: live update as you type
  updatePreview();
});

// Initialize with default path
pathInput.value = "M10 80 C 40 10, 65 10, 95 80 S 150 150, 180 80";
updatePreview();
</script>

</body>
</html>
