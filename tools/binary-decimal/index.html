<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary to Decimal Converter | FreeToolHub</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body {
    background: radial-gradient(circle at top, #0f172a, #020617);
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
}

.glass {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
}

input {
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.15);
}

button.primary {
    background: linear-gradient(90deg,#22d3ee,#a855f7);
}

.scrollbar::-webkit-scrollbar {
    width: 6px;
}
.scrollbar::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.3);
    border-radius: 6px;
}
</style>
</head>

<body class="flex items-center justify-center p-6">

<div class="glass w-full max-w-3xl rounded-2xl p-8 text-white">

    <!-- Header -->
    <div class="flex items-center gap-4 mb-6">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-cyan-400 to-purple-500 flex items-center justify-center text-xl">
            <i class="fa-solid fa-microchip"></i>
        </div>
        <div>
            <h1 class="text-2xl font-bold">Binary to Decimal</h1>
            <p class="text-sm text-gray-300">Convert binary numbers into decimal values</p>
        </div>
    </div>

    <!-- Input -->
    <div class="glass rounded-xl p-4 mb-6">
        <h3 class="font-semibold mb-2 flex items-center gap-2">
            <i class="fa-solid fa-0 text-cyan-400"></i> Binary Input
        </h3>
        <input id="binaryInput"
            placeholder="Enter binary (e.g. 101010)"
            class="w-full p-4 rounded-lg text-white outline-none">
    </div>

    <!-- Actions -->
    <div class="flex flex-wrap gap-4 mb-4">
        <button onclick="convertBinary()"
            class="primary px-6 py-3 rounded-lg font-semibold text-slate-900 hover:opacity-90 transition">
            <i class="fa-solid fa-arrow-right"></i> Convert
        </button>

        <button onclick="copyOutput()"
            class="px-6 py-3 rounded-lg font-semibold bg-white/20 text-white hover:bg-white/30 transition">
            <i class="fa-solid fa-copy"></i> Copy Result
        </button>
    </div>

    <!-- Output -->
    <div class="glass rounded-xl p-4">
        <h3 class="font-semibold mb-2 flex items-center gap-2">
            <i class="fa-solid fa-calculator text-purple-400"></i> Decimal Output
        </h3>
        <input id="decimalOutput"
            placeholder="Decimal result..."
            readonly
            class="w-full p-4 rounded-lg text-white outline-none">
    </div>

    <!-- Status -->
    <p id="status" class="mt-4 text-sm text-gray-300"></p>

    <!-- Footer -->
    <div class="mt-6 text-sm text-gray-400 flex justify-between">
        <span>FreeToolHub • Binary Converter</span>
        <span>Client-side only</span>
    </div>

</div>

<script>
const binaryInput = document.getElementById("binaryInput");
const decimalOutput = document.getElementById("decimalOutput");
const status = document.getElementById("status");

function convertBinary() {
    const value = binaryInput.value.trim();

    if (!/^[01]+$/.test(value)) {
        decimalOutput.value = "";
        status.textContent = "⚠ Invalid binary number (use only 0 and 1)";
        status.className = "mt-4 text-sm text-red-400";
        return;
    }

    decimalOutput.value = parseInt(value, 2);
    status.textContent = "✔ Successfully converted to decimal";
    status.className = "mt-4 text-sm text-green-400";
}

function copyOutput() {
    if (!decimalOutput.value) return;
    navigator.clipboard.writeText(decimalOutput.value);
    status.textContent = "📋 Decimal value copied to clipboard";
    status.className = "mt-4 text-sm text-cyan-400";
}
</script>

</body>
</html>
