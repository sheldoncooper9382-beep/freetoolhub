<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Countdown Timer – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --glass-bg: rgba(255, 255, 255, 0.15);
  --glass-border: rgba(255, 255, 255, 0.25);
  --accent: #7dd3fc;
  --text: #ffffff;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top left, #0f172a, #020617);
  color: var(--text);
}

.glass {
  width: 360px;
  padding: 30px;
  border-radius: 20px;
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  text-align: center;
}

h1 {
  margin-bottom: 20px;
  font-size: 1.4rem;
  font-weight: 600;
}

.time-inputs {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 20px;
}

.time-inputs input {
  width: 100%;
  padding: 10px;
  font-size: 1.1rem;
  text-align: center;
  border-radius: 12px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.2);
  color: white;
}

.time-inputs input::placeholder {
  color: rgba(255,255,255,0.7);
}

#display {
  font-size: 2.2rem;
  font-weight: bold;
  margin: 20px 0;
  letter-spacing: 2px;
}

.buttons {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
  font-weight: 600;
  color: #020617;
  background: var(--accent);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

button.secondary {
  background: rgba(255,255,255,0.6);
}
</style>
</head>

<body>

<div class="glass">
  <h1>⏳ Countdown Timer</h1>

  <div class="time-inputs">
    <input type="number" id="hours" placeholder="HH" min="0">
    <input type="number" id="minutes" placeholder="MM" min="0" max="59">
    <input type="number" id="seconds" placeholder="SS" min="0" max="59">
  </div>

  <div id="display">00:00:00</div>

  <div class="buttons">
    <button onclick="startTimer()">Start</button>
    <button class="secondary" onclick="pauseTimer()">Pause</button>
    <button class="secondary" onclick="resetTimer()">Reset</button>
  </div>
</div>

<script>
let totalSeconds = 0;
let timer = null;

function startTimer() {
  if (timer) return;

  if (totalSeconds === 0) {
    const h = parseInt(hours.value) || 0;
    const m = parseInt(minutes.value) || 0;
    const s = parseInt(seconds.value) || 0;
    totalSeconds = h * 3600 + m * 60 + s;
  }

  if (totalSeconds <= 0) return;

  timer = setInterval(() => {
    totalSeconds--;
    updateDisplay();

    if (totalSeconds <= 0) {
      clearInterval(timer);
      timer = null;
    }
  }, 1000);
}

function pauseTimer() {
  clearInterval(timer);
  timer = null;
}

function resetTimer() {
  pauseTimer();
  totalSeconds = 0;
  hours.value = minutes.value = seconds.value = "";
  updateDisplay();
}

function updateDisplay() {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;

  display.textContent =
    String(h).padStart(2, "0") + ":" +
    String(m).padStart(2, "0") + ":" +
    String(s).padStart(2, "0");
}
</script>

</body>
</html>
