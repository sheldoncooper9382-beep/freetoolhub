<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text Reverser – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --glass-bg: rgba(255,255,255,0.22);
  --glass-border: rgba(255,255,255,0.45);
  --accent: #22f0ff;
  --accent-2: #c084fc;
  --text: #f8fafc;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at top left, #1e293b, #020617),
    radial-gradient(circle at bottom right, #3b0764, transparent);
  color: var(--text);
}

.glass {
  width: 440px;
  padding: 30px;
  border-radius: 24px;
  background: var(--glass-bg);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 30px 60px rgba(0,0,0,0.5);
}

h1 {
  margin: 0 0 16px;
  text-align: center;
  font-size: 1.6rem;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  color: transparent;
}

.control {
  background: rgba(255,255,255,0.28);
  padding: 14px;
  border-radius: 16px;
  margin-bottom: 14px;
}

label {
  font-size: 0.75rem;
  opacity: 0.9;
}

textarea {
  width: 100%;
  margin-top: 6px;
  padding: 12px;
  border-radius: 14px;
  border: none;
  outline: none;
  resize: vertical;
  min-height: 90px;
  background: rgba(0,0,0,0.25);
  color: white;
  font-size: 0.95rem;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
}

.meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  opacity: 0.85;
  margin-top: 6px;
}

.output {
  margin-top: 14px;
  padding: 14px;
  border-radius: 16px;
  background: rgba(0,0,0,0.35);
  font-family: monospace;
  font-size: 0.9rem;
  min-height: 70px;
  white-space: pre-wrap;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

button {
  flex: 1;
  padding: 12px;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #020617;
  box-shadow:
    0 0 18px rgba(34,240,255,0.6),
    0 10px 25px rgba(0,0,0,0.45);
}

button.secondary {
  background: rgba(255,255,255,0.6);
}
</style>
</head>

<body>

<div class="glass">
  <h1>🔄 Text Reverser</h1>

  <div class="control">
    <label>Original Text</label>
    <textarea id="inputText" placeholder="Type or paste text here..." oninput="reverseText()"></textarea>
    <div class="meta">
      <span id="charCount">0 characters</span>
      <span>Live reverse</span>
    </div>
  </div>

  <div class="output" id="output">
    Reversed text will appear here…
  </div>

  <div class="actions">
    <button onclick="copyText()">Copy</button>
    <button class="secondary" onclick="clearText()">Clear</button>
  </div>
</div>

<script>
function reverseText() {
  const text = document.getElementById("inputText").value;
  document.getElementById("output").textContent =
    text.split("").reverse().join("");
  document.getElementById("charCount").textContent =
    text.length + " characters";
}

function copyText() {
  const text = document.getElementById("output").textContent;
  if (text.trim()) navigator.clipboard.writeText(text);
}

function clearText() {
  document.getElementById("inputText").value = "";
  document.getElementById("output").textContent =
    "Reversed text will appear here…";
  document.getElementById("charCount").textContent =
    "0 characters";
}
</script>

</body>
</html>
