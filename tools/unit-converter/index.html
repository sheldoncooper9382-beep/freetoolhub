<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter | FreeToolHub</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
  body {
    background: radial-gradient(circle at top, #0f172a, #020617);
  }
  .glass {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.15);
  }
</style>
</head>

<body class="min-h-screen flex items-center justify-center text-slate-100">

<div class="glass rounded-2xl shadow-2xl w-full max-w-xl p-6">
  <h1 class="text-2xl font-semibold mb-4 text-center">Unit Converter</h1>

  <!-- Category -->
  <div class="mb-4">
    <label class="text-sm opacity-80">Category</label>
    <select id="category" class="w-full mt-1 p-2 rounded-lg bg-slate-900/70 outline-none">
    </select>
  </div>

  <!-- Input -->
  <div class="grid grid-cols-2 gap-4 mb-4">
    <div>
      <label class="text-sm opacity-80">From</label>
      <select id="fromUnit" class="w-full mt-1 p-2 rounded-lg bg-slate-900/70 outline-none"></select>
    </div>
    <div>
      <label class="text-sm opacity-80">To</label>
      <select id="toUnit" class="w-full mt-1 p-2 rounded-lg bg-slate-900/70 outline-none"></select>
    </div>
  </div>

  <!-- Value -->
  <div class="mb-4">
    <label class="text-sm opacity-80">Value</label>
    <input id="inputValue" type="number" class="w-full mt-1 p-2 rounded-lg bg-slate-900/70 outline-none" value="1">
  </div>

  <!-- Result -->
  <div class="glass rounded-xl p-4 text-center">
    <div class="text-sm opacity-70">Result</div>
    <div id="result" class="text-2xl font-mono mt-1">—</div>
  </div>
</div>

<script>
const units = {
  Length: {
    Meter: 1,
    Kilometer: 1000,
    Centimeter: 0.01,
    Millimeter: 0.001,
    Mile: 1609.344,
    Yard: 0.9144,
    Foot: 0.3048,
    Inch: 0.0254
  },
  Weight: {
    Kilogram: 1,
    Gram: 0.001,
    Milligram: 0.000001,
    Pound: 0.45359237,
    Ounce: 0.0283495,
    Ton: 1000
  },
  Area: {
    "Square Meter": 1,
    "Square Kilometer": 1e6,
    "Square Foot": 0.092903,
    "Square Yard": 0.836127,
    Acre: 4046.86,
    Hectare: 10000
  },
  Volume: {
    Liter: 1,
    Milliliter: 0.001,
    "Cubic Meter": 1000,
    Gallon: 3.78541,
    Quart: 0.946353,
    Pint: 0.473176,
    Cup: 0.24
  },
  Speed: {
    "m/s": 1,
    "km/h": 0.277778,
    mph: 0.44704,
    Knot: 0.514444
  },
  Time: {
    Second: 1,
    Minute: 60,
    Hour: 3600,
    Day: 86400
  },
  Temperature: "TEMP"
};

const categorySelect = document.getElementById("category");
const fromUnit = document.getElementById("fromUnit");
const toUnit = document.getElementById("toUnit");
const inputValue = document.getElementById("inputValue");
const resultEl = document.getElementById("result");

Object.keys(units).forEach(cat => {
  const opt = document.createElement("option");
  opt.value = cat;
  opt.textContent = cat;
  categorySelect.appendChild(opt);
});

function populateUnits() {
  fromUnit.innerHTML = "";
  toUnit.innerHTML = "";

  const cat = categorySelect.value;
  if (units[cat] === "TEMP") {
    ["Celsius", "Fahrenheit", "Kelvin"].forEach(u => {
      fromUnit.add(new Option(u, u));
      toUnit.add(new Option(u, u));
    });
  } else {
    Object.keys(units[cat]).forEach(u => {
      fromUnit.add(new Option(u, u));
      toUnit.add(new Option(u, u));
    });
  }
  convert();
}

function convert() {
  const val = parseFloat(inputValue.value);
  if (isNaN(val)) return;

  const cat = categorySelect.value;
  const from = fromUnit.value;
  const to = toUnit.value;

  let output;

  if (units[cat] === "TEMP") {
    output = convertTemp(val, from, to);
  } else {
    const base = val * units[cat][from];
    output = base / units[cat][to];
  }

  resultEl.textContent = output.toLocaleString(undefined, { maximumFractionDigits: 8 });
}

function convertTemp(v, f, t) {
  let c;
  if (f === "Celsius") c = v;
  if (f === "Fahrenheit") c = (v - 32) * 5/9;
  if (f === "Kelvin") c = v - 273.15;

  if (t === "Celsius") return c;
  if (t === "Fahrenheit") return c * 9/5 + 32;
  if (t === "Kelvin") return c + 273.15;
}

categorySelect.onchange = populateUnits;
fromUnit.onchange = convert;
toUnit.onchange = convert;
inputValue.oninput = convert;

populateUnits();
</script>

</body>
</html>
