<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Font Previewer</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Poppins:wght@300;400;600;800&family=Roboto:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Font Previewer</h1>

  <div class="generator-wrapper">

    <!-- Preview -->
    <div class="preview">
      <div id="textPreview">The quick brown fox jumps over the lazy dog</div>
    </div>

    <!-- Controls -->
    <div class="controls">

      <label>Preview Text</label>
      <input type="text" id="previewText" value="The quick brown fox jumps over the lazy dog">

      <label>Font Family</label>
      <select id="fontFamily">
        <option value="Inter, sans-serif">Inter</option>
        <option value="Poppins, sans-serif">Poppins</option>
        <option value="Roboto, sans-serif">Roboto</option>
        <option value="'Playfair Display', serif">Playfair Display</option>
        <option value="Arial, sans-serif">Arial</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="Courier New, monospace">Courier New</option>
      </select>

      <label>Font Size (px)</label>
      <input type="range" id="fontSize" min="12" max="96" value="32">

      <label>Font Weight</label>
      <input type="range" id="fontWeight" min="100" max="900" step="100" value="400">

      <label>Line Height</label>
      <input type="range" id="lineHeight" min="1" max="2" step="0.1" value="1.3">

      <label>Letter Spacing (px)</label>
      <input type="range" id="letterSpacing" min="-2" max="10" value="0">

      <label>
        <input type="checkbox" id="italic"> Italic
      </label>

      <label>Text Color</label>
      <input type="color" id="textColor" value="#ffffff">

      <div class="button-row">
        <button onclick="copyCSS()">Copy CSS</button>
        <button onclick="resetAll()">Reset</button>
      </div>

      <textarea id="cssOutput" readonly></textarea>

    </div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
