<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Gradient Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Keep your existing CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="title">Text Gradient Generator</h1>

  <div class="tool-wrapper">

    <!-- LEFT: LIVE PREVIEW -->
    <div class="preview-panel">
      <div class="preview-box">
        <span id="previewText">Gradient Text</span>
      </div>
    </div>

    <!-- RIGHT: CONTROLS -->
    <div class="controls-panel">

      <label>Text</label>
      <input type="text" id="textInput" value="Gradient Text">

      <label>Font Size (px)</label>
      <input type="range" id="fontSize" min="16" max="160" value="72">

      <label>Font Weight</label>
      <input type="range" id="fontWeight" min="100" max="900" step="100" value="700">

      <label>
        <input type="checkbox" id="italicToggle">
        Italic
      </label>

      <label>Gradient Direction</label>
      <select id="direction">
        <option value="to right">Left to Right</option>
        <option value="to left">Right to Left</option>
        <option value="to bottom">Top to Bottom</option>
        <option value="to top">Bottom to Top</option>
        <option value="45deg">Diagonal</option>
      </select>

      <label>Colors</label>
      <div id="colorList" class="color-list">
        <input type="color" value="#ff77c6">
        <input type="color" value="#8b7cff">
        <input type="color" value="#4ade80">
      </div>

      <button id="addColor">Add Color</button>
      <button id="removeColor">Remove Color</button>

      <button id="copyCSS" class="primary">Copy CSS</button>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
