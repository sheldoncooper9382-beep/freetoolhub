<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Button Generator</h1>

  <div class="generator-wrapper">
    <!-- Left: Preview -->
    <div class="preview">
      <button id="previewButton">Click Me!</button>
    </div>

    <!-- Right: Controls -->
    <div class="controls">

      <label>Button Text</label>
      <input type="text" id="btnText" value="Click Me!">

      <label>Width (px)</label>
      <input type="range" id="btnWidth" min="50" max="400" value="150">
      <input type="number" id="btnWidthNum" min="50" max="400" value="150">

      <label>Height (px)</label>
      <input type="range" id="btnHeight" min="30" max="120" value="50">
      <input type="number" id="btnHeightNum" min="30" max="120" value="50">

      <label>Font Size (px)</label>
      <input type="range" id="btnFont" min="12" max="48" value="16">
      <input type="number" id="btnFontNum" min="12" max="48" value="16">

      <label>Border Radius</label>
      <input type="range" id="btnRadius" min="0" max="100" value="12">
      <input type="number" id="btnRadiusNum" min="0" max="100" value="12">

      <label>Gradient Start Color</label>
      <input type="color" id="gradStart" value="#ff6ec4">

      <label>Gradient End Color</label>
      <input type="color" id="gradEnd" value="#7873f5">

      <label>Shadow X Offset</label>
      <input type="range" id="shadowX" min="-50" max="50" value="5">

      <label>Shadow Y Offset</label>
      <input type="range" id="shadowY" min="-50" max="50" value="5">

      <label>Shadow Blur</label>
      <input type="range" id="shadowBlur" min="0" max="50" value="15">

      <label>
        <input type="checkbox" id="frosted"> Frosted Glass
      </label>

      <label>
        <input type="checkbox" id="neon"> Neon Effect
      </label>

      <label>
        <input type="checkbox" id="depth3d"> 3D Depth
      </label>

      <button id="copyCSS">Copy CSS</button>
      <button id="resetButton">Reset</button>

      <textarea id="cssOutput" readonly></textarea>
    </div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
