<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opacity Generator</title>

<style>
:root {
  --glass-bg: rgba(255,255,255,0.15);
  --glass-border: rgba(255,255,255,0.3);
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff6ec4, #7873f5, #4ade80);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
}

.wrapper {
  display: flex;
  gap: 30px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(14px);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

.preview {
  width: 260px;
  height: 260px;
  background:
    linear-gradient(45deg, #ccc 25%, transparent 25%),
    linear-gradient(-45deg, #ccc 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #ccc 75%),
    linear-gradient(-45deg, transparent 75%, #ccc 75%);
  background-size: 40px 40px;
  background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
}

.preview-box {
  width: 160px;
  height: 160px;
  background: #ffffff;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: #000;
}

.controls {
  width: 320px;
}

.control {
  margin-bottom: 16px;
}

.control label {
  display: block;
  font-size: 0.9em;
  margin-bottom: 4px;
}

input[type="range"] {
  width: 100%;
}

.code-box {
  background: rgba(0,0,0,0.35);
  padding: 10px;
  border-radius: 10px;
  font-family: monospace;
  font-size: 0.85em;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  background: #fff;
  color: #333;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="preview">
    <div class="preview-box" id="previewBox">
      Opacity
    </div>
  </div>

  <div class="controls">

    <div class="control">
      <label>Opacity</label>
      <input type="range" id="opacity" min="0" max="1" step="0.01" value="1">
    </div>

    <div class="code-box" id="cssOutput"></div>
    <button id="copyBtn">Copy CSS</button>

  </div>
</div>

<script>
const previewBox = document.getElementById("previewBox");
const opacity = document.getElementById("opacity");
const cssOutput = document.getElementById("cssOutput");
const copyBtn = document.getElementById("copyBtn");

function updateOpacity() {
  previewBox.style.opacity = opacity.value;
  cssOutput.textContent = `opacity: ${opacity.value};`;
}

opacity.addEventListener("input", updateOpacity);

copyBtn.addEventListener("click", () => {
  navigator.clipboard.writeText(cssOutput.textContent);
  copyBtn.textContent = "Copied!";
  setTimeout(() => copyBtn.textContent = "Copy CSS", 1500);
});

updateOpacity();
</script>

</body>
</html>
