<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tip Calculator – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --glass-bg: rgba(255,255,255,0.22);
  --glass-border: rgba(255,255,255,0.45);
  --accent: #22f0ff;
  --accent-2: #c084fc;
  --text: #f8fafc;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at top left, #1e293b, #020617),
    radial-gradient(circle at bottom right, #3b0764, transparent);
  color: var(--text);
}

.glass {
  width: 420px;
  padding: 30px;
  border-radius: 24px;
  background: var(--glass-bg);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 30px 60px rgba(0,0,0,0.5);
}

h1 {
  margin: 0 0 18px;
  text-align: center;
  font-size: 1.6rem;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  color: transparent;
}

.control {
  background: rgba(255,255,255,0.28);
  padding: 12px;
  border-radius: 16px;
  margin-bottom: 12px;
}

label {
  font-size: 0.75rem;
  opacity: 0.9;
}

input[type="number"] {
  width: 100%;
  margin-top: 6px;
  padding: 10px;
  border-radius: 12px;
  border: none;
  outline: none;
  background: rgba(0,0,0,0.25);
  color: white;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
}

.range-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
}

input[type="range"] {
  flex: 1;
}

.percent {
  min-width: 50px;
  text-align: right;
  font-weight: 700;
  color: var(--accent);
}

.results {
  margin-top: 16px;
  padding: 16px;
  border-radius: 18px;
  background: rgba(0,0,0,0.35);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
}

.result-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 0.95rem;
}

.result-row strong {
  color: var(--accent);
}

.note {
  margin-top: 10px;
  font-size: 0.7rem;
  opacity: 0.8;
  text-align: center;
}
</style>
</head>

<body>

<div class="glass">
  <h1>💸 Tip Calculator</h1>

  <div class="control">
    <label>Bill Amount</label>
    <input type="number" id="bill" placeholder="e.g. 85.50" oninput="calculateTip()">
  </div>

  <div class="control">
    <label>Tip Percentage</label>
    <div class="range-wrap">
      <input type="range" id="tipRange" min="0" max="30" value="18" oninput="syncTip()">
      <div class="percent"><span id="tipValue">18</span>%</div>
    </div>
  </div>

  <div class="control">
    <label>Split Between People</label>
    <input type="number" id="people" value="1" min="1" oninput="calculateTip()">
  </div>

  <div class="results">
    <div class="result-row">
      <span>Tip Amount</span>
      <strong id="tipAmount">$0.00</strong>
    </div>
    <div class="result-row">
      <span>Total Bill</span>
      <strong id="totalBill">$0.00</strong>
    </div>
    <div class="result-row">
      <span>Per Person</span>
      <strong id="perPerson">$0.00</strong>
    </div>
  </div>

  <div class="note">
    Calculations update automatically as you type.
  </div>
</div>

<script>
function syncTip() {
  document.getElementById("tipValue").textContent =
    document.getElementById("tipRange").value;
  calculateTip();
}

function calculateTip() {
  const bill = parseFloat(document.getElementById("bill").value) || 0;
  const tipPercent = parseFloat(document.getElementById("tipRange").value);
  const people = parseInt(document.getElementById("people").value) || 1;

  const tip = bill * (tipPercent / 100);
  const total = bill + tip;
  const perPerson = total / people;

  document.getElementById("tipAmount").textContent =
    "$" + tip.toFixed(2);

  document.getElementById("totalBill").textContent =
    "$" + total.toFixed(2);

  document.getElementById("perPerson").textContent =
    "$" + perPerson.toFixed(2);
}

syncTip();
</script>

</body>
</html>
