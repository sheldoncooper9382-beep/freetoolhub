<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Border Radius Generator</title>

<style>
:root {
  --glass-bg: rgba(255,255,255,0.15);
  --glass-border: rgba(255,255,255,0.3);
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff6ec4, #7873f5, #4ade80);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
}

.wrapper {
  display: flex;
  gap: 30px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(14px);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

.preview {
  width: 260px;
  height: 260px;
  background: rgba(255,255,255,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 20px;
  font-weight: bold;
}

.controls {
  width: 320px;
}

.control {
  margin-bottom: 14px;
}

.control label {
  display: block;
  font-size: 0.9em;
  margin-bottom: 4px;
}

input[type="range"] {
  width: 100%;
}

.code-box {
  background: rgba(0,0,0,0.35);
  padding: 10px;
  border-radius: 10px;
  font-family: monospace;
  font-size: 0.85em;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  background: #fff;
  color: #333;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="preview" id="previewBox">
    Preview
  </div>

  <div class="controls">

    <div class="control">
      <label>Top Left</label>
      <input type="range" id="tl" min="0" max="100" value="20">
    </div>

    <div class="control">
      <label>Top Right</label>
      <input type="range" id="tr" min="0" max="100" value="20">
    </div>

    <div class="control">
      <label>Bottom Right</label>
      <input type="range" id="br" min="0" max="100" value="20">
    </div>

    <div class="control">
      <label>Bottom Left</label>
      <input type="range" id="bl" min="0" max="100" value="20">
    </div>

    <div class="code-box" id="cssOutput"></div>
    <button id="copyBtn">Copy CSS</button>

  </div>
</div>

<script>
const preview = document.getElementById("previewBox");
const tl = document.getElementById("tl");
const tr = document.getElementById("tr");
const br = document.getElementById("br");
const bl = document.getElementById("bl");
const cssOutput = document.getElementById("cssOutput");
const copyBtn = document.getElementById("copyBtn");

function updateRadius() {
  const radius = `${tl.value}px ${tr.value}px ${br.value}px ${bl.value}px`;
  preview.style.borderRadius = radius;
  cssOutput.textContent = `border-radius: ${radius};`;
}

document.querySelectorAll("input").forEach(input =>
  input.addEventListener("input", updateRadius)
);

copyBtn.addEventListener("click", () => {
  navigator.clipboard.writeText(cssOutput.textContent);
  copyBtn.textContent = "Copied!";
  setTimeout(() => copyBtn.textContent = "Copy CSS", 1500);
});

updateRadius();
</script>

</body>
</html>
