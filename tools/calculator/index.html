<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University‑Level Scientific Calculator</title>
    <!--
      This calculator implements a wide range of mathematical
      operations suitable for university‑level mathematics.  It
      includes core arithmetic, exponentiation, trigonometric
      functions with degree/radian toggle, logarithms, factorials,
      permutations/combinations, modular arithmetic and a number of
      interactive tools (summation, product, derivative and
      integration).  The UI is designed for high contrast and
      accessibility.  All logic lives in calculator.js.
    -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="calculator" class="calc-container" aria-label="Scientific calculator">
      <!-- Display section showing the current expression and the result.  -->
      <div class="display" role="region" aria-live="polite">
        <div id="expression" class="expression">&nbsp;</div>
        <div id="result" class="result">0</div>
      </div>

      <!-- Memory, mode and history controls -->
      <div class="button-grid">
        <!-- Row 1: Memory and mode toggles -->
        <button class="btn function-btn" data-action="memoryClear" aria-label="Memory Clear (MC)">MC</button>
        <button class="btn function-btn" data-action="memoryRecall" aria-label="Memory Recall (MR)">MR</button>
        <button class="btn function-btn" data-action="memoryAdd" aria-label="Memory Plus (M+)">M+</button>
        <button class="btn function-btn" data-action="memorySubtract" aria-label="Memory Minus (M-)">M-</button>
        <button class="btn function-btn" data-action="toggleDegRad" aria-label="Toggle degree or radian mode">RAD</button>
        <button class="btn function-btn" data-action="toggleHistory" aria-label="Toggle history panel">History</button>

        <!-- Row 2: Clear and editing controls -->
        <button class="btn function-btn" data-action="clear" aria-label="Clear all">C</button>
        <button class="btn function-btn" data-action="clearEntry" aria-label="Clear entry">CE</button>
        <button class="btn function-btn" data-action="backspace" aria-label="Backspace">←</button>
        <button class="btn function-btn" data-action="negate" aria-label="Negate result">±</button>
        <button class="btn function-btn" data-action="copyResult" aria-label="Copy result to clipboard">Copy</button>
        <button class="btn operator-btn" data-value="mod" aria-label="Modulus operator">mod</button>

        <!-- Row 3: Grouping and simple functions -->
        <button class="btn operator-btn" data-value="(" aria-label="Left parenthesis">(</button>
        <button class="btn operator-btn" data-value=")" aria-label="Right parenthesis">)</button>
        <button class="btn function-btn" data-action="abs" aria-label="Absolute value">abs</button>
        <button class="btn function-btn" data-action="sqrt" aria-label="Square root">√</button>
        <button class="btn function-btn" data-action="square" aria-label="Square">x²</button>
        <button class="btn function-btn" data-action="cube" aria-label="Cube">x³</button>

        <!-- Row 4: Trigonometric functions -->
        <button class="btn function-btn" data-action="sin" aria-label="Sine">sin</button>
        <button class="btn function-btn" data-action="cos" aria-label="Cosine">cos</button>
        <button class="btn function-btn" data-action="tan" aria-label="Tangent">tan</button>
        <button class="btn function-btn" data-action="asin" aria-label="Inverse sine">asin</button>
        <button class="btn function-btn" data-action="acos" aria-label="Inverse cosine">acos</button>
        <button class="btn function-btn" data-action="atan" aria-label="Inverse tangent">atan</button>

        <!-- Row 5: Logarithms, constants and special ops -->
        <button class="btn function-btn" data-action="ln" aria-label="Natural logarithm">ln</button>
        <button class="btn function-btn" data-action="log10" aria-label="Common logarithm">log</button>
        <button class="btn constant-btn" data-value="pi" aria-label="Pi constant">π</button>
        <button class="btn constant-btn" data-value="e" aria-label="Euler's number">e</button>
        <button class="btn operator-btn" data-value="nPr" aria-label="Permutation operator">nPr</button>
        <button class="btn operator-btn" data-value="nCr" aria-label="Combination operator">nCr</button>

        <!-- Row 6: Digit row with division and exponent -->
        <button class="btn digit-btn" data-value="7">7</button>
        <button class="btn digit-btn" data-value="8">8</button>
        <button class="btn digit-btn" data-value="9">9</button>
        <button class="btn operator-btn" data-value="/">÷</button>
        <button class="btn function-btn" data-action="nthRoot" aria-label="Nth root">ⁿ√x</button>
        <button class="btn operator-btn" data-value="^" aria-label="Power operator">xʸ</button>

        <!-- Row 7: Middle digit row with multiplication and summation/product -->
        <button class="btn digit-btn" data-value="4">4</button>
        <button class="btn digit-btn" data-value="5">5</button>
        <button class="btn digit-btn" data-value="6">6</button>
        <button class="btn operator-btn" data-value="*">×</button>
        <button class="btn function-btn" data-action="summation" aria-label="Summation">Σ</button>
        <button class="btn function-btn" data-action="product" aria-label="Product">Π</button>

        <!-- Row 8: Lower digit row with subtraction and calculus operations -->
        <button class="btn digit-btn" data-value="1">1</button>
        <button class="btn digit-btn" data-value="2">2</button>
        <button class="btn digit-btn" data-value="3">3</button>
        <button class="btn operator-btn" data-value="-">−</button>
        <button class="btn function-btn" data-action="derivative" aria-label="Derivative">d/dx</button>
        <button class="btn function-btn" data-action="integral" aria-label="Integral">∫</button>

        <!-- Row 9: Final row with zero, decimal, equals, addition, answer recall and factorial -->
        <button class="btn digit-btn" data-value="0">0</button>
        <button class="btn digit-btn" data-value=".">.</button>
        <button class="btn equals-btn" data-action="equals" aria-label="Equals">=</button>
        <button class="btn operator-btn" data-value="+">+</button>
        <button class="btn function-btn" data-action="answer" aria-label="Use previous answer">Ans</button>
        <button class="btn function-btn" data-action="factorial" aria-label="Factorial">!</button>
      </div>

      <!-- History panel: hidden by default -->
      <div id="history-panel" class="history-panel" aria-label="Calculation history" aria-hidden="true">
        <h2>History</h2>
        <ul id="history-list"></ul>
      </div>
    </div>

    <script src="calculator.js"></script>
  </body>
</html>
