<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphic Scientific Calculator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #141e30, #243b55);
  font-family: system-ui, sans-serif;
  color: #fff;
}

/* ===== GLASS CONTAINER ===== */
.calculator {
  width: 340px;
  padding: 20px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

/* ===== DISPLAY ===== */
.display {
  background: rgba(0, 0, 0, 0.35);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 12px;
  overflow-x: auto;
}

#prev {
  font-size: 0.8rem;
  opacity: 0.7;
  min-height: 18px;
}

#display {
  font-size: 1.6rem;
  text-align: right;
  word-wrap: break-word;
}

/* ===== BUTTON GRID ===== */
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button {
  height: 52px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  color: white;
  font-size: 1rem;
  cursor: pointer;
  transition: transform 0.1s ease, background 0.2s ease;
}

button:hover {
  background: rgba(255, 255, 255, 0.28);
}

button:active {
  transform: scale(0.96);
}

.operator {
  background: rgba(0, 140, 255, 0.35);
}

.equal {
  background: rgba(0, 200, 120, 0.45);
  grid-column: span 2;
}

.clear {
  background: rgba(255, 80, 80, 0.45);
}

@media (max-width: 420px) {
  .calculator {
    width: 92%;
  }
}
</style>
</head>

<body>

<div class="calculator">
  <div class="display">
    <div id="prev"></div>
    <div id="display">0</div>
  </div>

  <div class="buttons">
    <button class="clear" onclick="clearAll()">C</button>
    <button onclick="backspace()">⌫</button>
    <button onclick="append('(')">(</button>
    <button onclick="append(')')">)</button>

    <button onclick="append('sin(')">sin</button>
    <button onclick="append('cos(')">cos</button>
    <button onclick="append('tan(')">tan</button>
    <button onclick="append('^')" class="operator">^</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button onclick="append('/')" class="operator">÷</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button onclick="append('*')" class="operator">×</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button onclick="append('-')" class="operator">−</button>

    <button onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
    <button onclick="append('+')" class="operator">+</button>
    <button onclick="evaluateExpr()" class="equal">=</button>
  </div>
</div>

<script>
let expression = "0";
let memory = 0;

const display = document.getElementById("display");
const prev = document.getElementById("prev");

function update(prevText = "") {
  display.textContent = expression;
  prev.textContent = prevText;
}

function append(val) {
  if (expression === "0" && /[0-9.(]/.test(val)) {
    expression = val;
  } else {
    expression += val;
  }
  update();
}

function clearAll() {
  expression = "0";
  update("");
}

function backspace() {
  expression = expression.length > 1 ? expression.slice(0, -1) : "0";
  update();
}

function factorial(n) {
  n = Number(n);
  if (!Number.isInteger(n) || n < 0) return NaN;
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}

function toRadians(x) {
  return x * Math.PI / 180;
}

function log10(x) {
  return Math.log(x) / Math.LN10;
}

function autoCloseParens(expr) {
  const open = (expr.match(/\(/g) || []).length;
  const close = (expr.match(/\)/g) || []).length;
  return expr + ")".repeat(Math.max(0, open - close));
}

function parseExpression(expr) {
  let s = expr.replace(/\s+/g, "");

  s = s.replace(/π/g, "Math.PI");
  s = s.replace(/(^|[^a-zA-Z])e([^a-zA-Z]|$)/g, "$1Math.E$2");

  s = s.replace(/sin\(/g, "Math.sin(toRadians(");
  s = s.replace(/cos\(/g, "Math.cos(toRadians(");
  s = s.replace(/tan\(/g, "Math.tan(toRadians(");

  s = s.replace(/log\(/g, "log10(");
  s = s.replace(/ln\(/g, "Math.log(");
  s = s.replace(/sqrt\(/g, "Math.sqrt(");
  s = s.replace(/abs\(/g, "Math.abs(");
  s = s.replace(/exp\(/g, "Math.exp(");

  while (/(\d+|\([^()]*\))!/.test(s)) {
    s = s.replace(/(\d+|\([^()]*\))!/g, "factorial($1)");
  }

  s = s.replace(/\^/g, "**");

  return autoCloseParens(s);
}

function evaluateExprToNumber(expr) {
  return Function(
    "factorial",
    "toRadians",
    "log10",
    "Math",
    `"use strict"; return (${parseExpression(expr)});`
  )(factorial, toRadians, log10, Math);
}

function evaluateExpr() {
  try {
    const result = evaluateExprToNumber(expression);
    if (!isFinite(result)) throw 0;
    update(expression + " =");
    expression = String(result);
  } catch {
    expression = "Error";
    update("");
    setTimeout(clearAll, 1000);
  }
}

document.addEventListener("keydown", e => {
  if ("0123456789.+-*/()^!".includes(e.key)) append(e.key);
  if (e.key === "Enter") evaluateExpr();
  if (e.key === "Backspace") backspace();
  if (e.key === "Escape") clearAll();
});

update();
</script>

</body>
</html>
