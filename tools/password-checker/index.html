<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Checker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Password Strength Checker</h1>

  <div class="controls">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" oninput="checkStrength()">
    <label>
      <input type="checkbox" id="showPassword" onchange="togglePassword()"> Show Password
    </label>

    <div class="strength-meter">
      <div id="strengthBar"></div>
    </div>

    <ul class="criteria">
      <li id="length">Minimum 8 characters</li>
      <li id="uppercase">At least 1 uppercase letter</li>
      <li id="lowercase">At least 1 lowercase letter</li>
      <li id="number">At least 1 number</li>
      <li id="symbol">At least 1 symbol (!@#$%)</li>
    </ul>

    <button onclick="copyPassword()">Copy Password</button>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
