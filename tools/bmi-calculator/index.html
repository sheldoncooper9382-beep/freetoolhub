<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BMI Calculator – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --glass-bg: rgba(255,255,255,0.22);
  --glass-border: rgba(255,255,255,0.45);
  --accent: #22f0ff;
  --accent-2: #c084fc;
  --text: #f8fafc;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at top left, #1e293b, #020617),
    radial-gradient(circle at bottom right, #3b0764, transparent);
  color: var(--text);
}

.glass {
  width: 440px;
  padding: 30px;
  border-radius: 24px;
  background: var(--glass-bg);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 30px 60px rgba(0,0,0,0.5);
}

h1 {
  margin: 0 0 18px;
  text-align: center;
  font-size: 1.6rem;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  color: transparent;
}

.unit-toggle {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.unit-toggle button {
  flex: 1;
  padding: 10px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  background: rgba(255,255,255,0.35);
  color: #020617;
}

.unit-toggle button.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}

.control {
  background: rgba(255,255,255,0.28);
  padding: 12px;
  border-radius: 16px;
  margin-bottom: 12px;
}

label {
  font-size: 0.75rem;
  opacity: 0.9;
}

input {
  width: 100%;
  margin-top: 6px;
  padding: 10px;
  border-radius: 12px;
  border: none;
  outline: none;
  background: rgba(0,0,0,0.25);
  color: white;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
}

.result {
  margin-top: 18px;
  padding: 16px;
  border-radius: 16px;
  background: rgba(0,0,0,0.35);
  text-align: center;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
}

.bmi {
  font-size: 2rem;
  font-weight: 800;
}

.category {
  margin-top: 6px;
  font-size: 1rem;
  font-weight: 600;
}

.note {
  margin-top: 10px;
  font-size: 0.7rem;
  opacity: 0.8;
  text-align: center;
}

button.calc {
  margin-top: 16px;
  width: 100%;
  padding: 14px;
  border-radius: 18px;
  border: none;
  cursor: pointer;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #020617;
  box-shadow:
    0 0 22px rgba(34,240,255,0.7),
    0 12px 30px rgba(0,0,0,0.45);
  transition: transform 0.15s ease;
}

button.calc:hover {
  transform: translateY(-2px);
}
</style>
</head>

<body>

<div class="glass">
  <h1>🧮 BMI Calculator</h1>

  <div class="unit-toggle">
    <button id="metricBtn" class="active" onclick="setUnit('metric')">Metric</button>
    <button id="imperialBtn" onclick="setUnit('imperial')">Imperial</button>
  </div>

  <div class="control">
    <label id="heightLabel">Height (cm)</label>
    <input type="number" id="height" placeholder="Enter height">
  </div>

  <div class="control">
    <label id="weightLabel">Weight (kg)</label>
    <input type="number" id="weight" placeholder="Enter weight">
  </div>

  <button class="calc" onclick="calculateBMI()">Calculate BMI</button>

  <div class="result" id="result">
    <div class="bmi">—</div>
    <div class="category">Enter your details</div>
  </div>

  <div class="note">
    BMI is a general indicator and not a medical diagnosis.
  </div>
</div>

<script>
let unit = "metric";

function setUnit(u) {
  unit = u;
  document.getElementById("metricBtn").classList.toggle("active", u === "metric");
  document.getElementById("imperialBtn").classList.toggle("active", u === "imperial");

  document.getElementById("heightLabel").textContent =
    u === "metric" ? "Height (cm)" : "Height (inches)";
  document.getElementById("weightLabel").textContent =
    u === "metric" ? "Weight (kg)" : "Weight (lbs)";
}

function calculateBMI() {
  const h = parseFloat(document.getElementById("height").value);
  const w = parseFloat(document.getElementById("weight").value);

  if (!h || !w) return;

  let bmi;
  if (unit === "metric") {
    bmi = w / Math.pow(h / 100, 2);
  } else {
    bmi = (w / Math.pow(h, 2)) * 703;
  }

  bmi = bmi.toFixed(1);

  let category = "";
  let color = "#22f0ff";

  if (bmi < 18.5) { category = "Underweight"; color = "#38bdf8"; }
  else if (bmi < 25) { category = "Normal weight"; color = "#22c55e"; }
  else if (bmi < 30) { category = "Overweight"; color = "#facc15"; }
  else { category = "Obese"; color = "#ef4444"; }

  document.querySelector(".bmi").textContent = bmi;
  document.querySelector(".category").textContent = category;
  document.querySelector(".bmi").style.color = color;
}
</script>

</body>
</html>
