<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clipboard Copy Tool – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --glass-bg: rgba(255, 255, 255, 0.15);
  --glass-border: rgba(255, 255, 255, 0.25);
  --accent: #7dd3fc;
  --text: #ffffff;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top left, #0f172a, #020617);
  color: var(--text);
}

.glass {
  width: 420px;
  padding: 28px;
  border-radius: 20px;
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  box-shadow: 0 20px 40px rgba(0,0,0,0.35);
}

h1 {
  margin: 0 0 16px;
  text-align: center;
  font-size: 1.4rem;
  font-weight: 600;
}

textarea {
  width: 100%;
  min-height: 120px;
  padding: 14px;
  border-radius: 14px;
  border: none;
  resize: vertical;
  outline: none;
  background: rgba(255,255,255,0.2);
  color: white;
  font-size: 0.95rem;
}

textarea::placeholder {
  color: rgba(255,255,255,0.75);
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
  font-weight: 600;
  background: var(--accent);
  color: #020617;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

button.secondary {
  background: rgba(255,255,255,0.6);
}

#status {
  margin-top: 12px;
  text-align: center;
  font-size: 0.85rem;
  opacity: 0.9;
}
</style>
</head>

<body>

<div class="glass">
  <h1>📋 Clipboard Copy Tool</h1>

  <textarea id="text" placeholder="Type or paste text here..."></textarea>

  <div class="actions">
    <button onclick="copyText()">Copy</button>
    <button class="secondary" onclick="clearText()">Clear</button>
  </div>

  <div id="status"></div>
</div>

<script>
function copyText() {
  const textarea = document.getElementById("text");
  const status = document.getElementById("status");

  if (!textarea.value.trim()) {
    status.textContent = "Nothing to copy.";
    return;
  }

  navigator.clipboard.writeText(textarea.value).then(() => {
    status.textContent = "Copied to clipboard ✔";
    setTimeout(() => status.textContent = "", 2000);
  }).catch(() => {
    status.textContent = "Clipboard access denied.";
  });
}

function clearText() {
  document.getElementById("text").value = "";
  document.getElementById("status").textContent = "";
}
</script>

</body>
</html>
