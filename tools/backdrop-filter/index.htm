<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backdrop Filter Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Backdrop Filter Generator</h1>

  <div class="generator-wrapper">

    <!-- Preview -->
    <div class="preview-area">
      <div id="glassBox">
        Glass Preview
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <label>Blur (px)</label>
      <input type="range" id="blur" min="0" max="40" value="12">

      <label>Brightness (%)</label>
      <input type="range" id="brightness" min="50" max="150" value="100">

      <label>Contrast (%)</label>
      <input type="range" id="contrast" min="50" max="150" value="100">

      <label>Saturation (%)</label>
      <input type="range" id="saturate" min="0" max="200" value="120">

      <label>Hue Rotate (deg)</label>
      <input type="range" id="hue" min="0" max="360" value="0">

      <label>Glass Opacity</label>
      <input type="range" id="opacity" min="0.05" max="0.5" step="0.01" value="0.15">

      <label>Glass Tint Color</label>
      <input type="color" id="tint" value="#ffffff">

      <div class="button-row">
        <button onclick="copyCSS()">Copy CSS</button>
        <button onclick="downloadCSS()">Download</button>
        <button onclick="resetAll()">Reset</button>
      </div>

      <textarea id="cssOutput" readonly></textarea>
    </div>

  </div>
</div>

<script src="main.js"></script>
</body>
</html>
