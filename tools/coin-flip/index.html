<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coin Flip – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --glass-bg: rgba(255,255,255,0.22);
  --glass-border: rgba(255,255,255,0.45);
  --accent: #facc15;
  --accent-2: #fde047;
  --text: #f8fafc;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at top left, #1e293b, #020617),
    radial-gradient(circle at bottom right, #3b0764, transparent);
  color: var(--text);
}

.glass {
  width: 420px;
  padding: 30px;
  border-radius: 24px;
  background: var(--glass-bg);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  text-align: center;
}

h1 {
  margin: 0 0 20px;
  font-size: 1.6rem;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  color: transparent;
}

/* --- Coin Scene --- */
.scene {
  perspective: 900px;
  height: 180px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.coin {
  width: 90px;
  height: 90px;
  position: relative;
  transform-style: preserve-3d;
}

.coin.flip {
  animation: flip 1.6s ease-in-out forwards;
}

@keyframes flip {
  0%   { transform: translateY(0) rotateX(0); }
  30%  { transform: translateY(-120px) rotateX(720deg); }
  70%  { transform: translateY(-120px) rotateX(1440deg); }
  100% { transform: translateY(0) rotateX(var(--final-rotation)); }
}

.face {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  backface-visibility: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 800;
  font-size: 1.1rem;
  color: #78350f;
  background:
    radial-gradient(circle at top left, #fde68a, #f59e0b);
  box-shadow:
    inset 0 0 0 4px #facc15,
    inset 0 0 0 8px #f59e0b,
    0 10px 25px rgba(250,204,21,0.6);
}

.tails {
  transform: rotateX(180deg);
  background:
    radial-gradient(circle at top left, #fef3c7, #fbbf24);
}

.result {
  margin-top: 12px;
  font-size: 1.1rem;
  font-weight: 600;
}

button {
  margin-top: 18px;
  padding: 14px;
  width: 100%;
  border-radius: 18px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  font-size: 1rem;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #422006;
  box-shadow:
    0 0 22px rgba(250,204,21,0.8),
    0 12px 30px rgba(0,0,0,0.45);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:hover {
  transform: translateY(-2px);
  box-shadow:
    0 0 32px rgba(250,204,21,1),
    0 18px 40px rgba(0,0,0,0.6);
}
</style>
</head>

<body>

<div class="glass">
  <h1>🪙 Coin Flip</h1>

  <div class="scene">
    <div class="coin" id="coin">
      <div class="face heads">HEADS</div>
      <div class="face tails">TAILS</div>
    </div>
  </div>

  <div class="result" id="result">Click flip to begin</div>

  <button onclick="flipCoin()">Flip Coin</button>
</div>

<script>
const coin = document.getElementById("coin");
const result = document.getElementById("result");

let flipping = false;

function flipCoin() {
  if (flipping) return;
  flipping = true;

  const isHeads = Math.random() < 0.5;
  const finalRotation = isHeads ? "0deg" : "180deg";

  coin.style.setProperty("--final-rotation", finalRotation);
  coin.classList.remove("flip");
  void coin.offsetWidth; // reset animation
  coin.classList.add("flip");

  result.textContent = "Flipping...";

  setTimeout(() => {
    result.textContent = isHeads ? "Result: Heads 🟡" : "Result: Tails 🟠";
    flipping = false;
  }, 1600);
}
</script>

</body>
</html>
