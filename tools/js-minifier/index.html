<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Minifier | FreeToolHub</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body {
    background: radial-gradient(circle at top, #0f172a, #020617);
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
}

.glass {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
}

textarea {
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.15);
}

button.primary {
    background: linear-gradient(90deg,#22d3ee,#a855f7);
}

.scrollbar::-webkit-scrollbar {
    width: 6px;
}
.scrollbar::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.3);
    border-radius: 6px;
}
</style>
</head>

<body class="flex items-center justify-center p-6">

<div class="glass w-full max-w-6xl rounded-2xl p-8 text-white">

    <!-- Header -->
    <div class="flex items-center gap-4 mb-6">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center text-xl">
            <i class="fa-brands fa-js"></i>
        </div>
        <div>
            <h1 class="text-2xl font-bold">JavaScript Minifier</h1>
            <p class="text-sm text-gray-300">Reduce JavaScript file size for faster load times</p>
        </div>
    </div>

    <!-- Editors -->
    <div class="grid md:grid-cols-2 gap-6">

        <!-- Input -->
        <div class="glass rounded-xl p-4">
            <h3 class="font-semibold mb-2 flex items-center gap-2">
                <i class="fa-solid fa-code text-yellow-400"></i> Original JavaScript
            </h3>
            <textarea id="jsInput" rows="14"
                placeholder="Paste your JavaScript here..."
                class="w-full p-4 rounded-lg text-white outline-none scrollbar"></textarea>
        </div>

        <!-- Output -->
        <div class="glass rounded-xl p-4">
            <h3 class="font-semibold mb-2 flex items-center gap-2">
                <i class="fa-solid fa-file-zipper text-orange-400"></i> Minified JavaScript
            </h3>
            <textarea id="jsOutput" rows="14"
                placeholder="Minified JavaScript will appear here..."
                class="w-full p-4 rounded-lg text-white outline-none scrollbar"></textarea>
        </div>

    </div>

    <!-- Actions -->
    <div class="flex flex-wrap gap-4 mt-6">
        <button onclick="minifyJS()"
            class="primary px-6 py-3 rounded-lg font-semibold text-slate-900 hover:opacity-90 transition">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Minify JavaScript
        </button>

        <button onclick="copyOutput()"
            class="px-6 py-3 rounded-lg font-semibold bg-white/20 text-white hover:bg-white/30 transition">
            <i class="fa-solid fa-copy"></i> Copy Minified
        </button>
    </div>

    <!-- Stats -->
    <p id="stats" class="mt-4 text-sm text-gray-300"></p>

    <!-- Footer -->
    <div class="mt-6 text-sm text-gray-400 flex justify-between">
        <span>FreeToolHub • JavaScript Tools</span>
        <span>Client-side only</span>
    </div>

</div>

<script>
const jsInput = document.getElementById("jsInput");
const jsOutput = document.getElementById("jsOutput");
const stats = document.getElementById("stats");

function minifyJS() {
    const original = jsInput.value;

    if (!original.trim()) {
        jsOutput.value = "";
        stats.textContent = "⚠ Please enter some JavaScript to minify";
        stats.className = "mt-4 text-sm text-red-400";
        return;
    }

    try {
        const minified = original
            .replace(/\/\/.*$/gm, "")              // remove single-line comments
            .replace(/\/\*[\s\S]*?\*\//g, "")      // remove block comments
            .replace(/\n+/g, "")                   // remove line breaks
            .replace(/\s+/g, " ")                  // collapse whitespace
            .replace(/\s*([=+\-*/{}();,:<>])\s*/g, "$1") // trim around symbols
            .trim();

        jsOutput.value = minified;

        const originalSize = new Blob([original]).size;
        const minifiedSize = new Blob([minified]).size;
        const saved = originalSize - minifiedSize;

        stats.textContent =
            `✔ Minified successfully • Original: ${originalSize} bytes • Minified: ${minifiedSize} bytes • Saved: ${saved} bytes`;
        stats.className = "mt-4 text-sm text-green-400";

    } catch (e) {
        jsOutput.value = "";
        stats.textContent = "❌ Error minifying JavaScript";
        stats.className = "mt-4 text-sm text-red-400";
    }
}

function copyOutput() {
    if (!jsOutput.value) return;
    navigator.clipboard.writeText(jsOutput.value);
    stats.textContent = "📋 Minified JavaScript copied to clipboard";
    stats.className = "mt-4 text-sm text-cyan-400";
}
</script>

</body>
</html>
