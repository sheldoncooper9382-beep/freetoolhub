<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Flexbox Generator – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* =========================
   FreeToolHub Glass Theme
========================= */
:root {
  --glass-bg: rgba(255,255,255,0.14);
  --glass-border: rgba(255,255,255,0.28);
  --accent: #7dd3fc;
  --accent2: #a855f7;
  --text: #f8fafc;
}

* {
  box-sizing: border-box;
  font-family: system-ui, Segoe UI, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top left, #1e293b, #020617);
  color: var(--text);
}

/* =========================
   App Layout
========================= */
.app {
  width: 1000px;
  max-width: 96%;
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 20px;
}

/* =========================
   Glass Panels
========================= */
.panel {
  padding: 22px;
  border-radius: 22px;
  background: linear-gradient(
    145deg,
    rgba(255,255,255,0.22),
    rgba(255,255,255,0.06)
  );
  backdrop-filter: blur(22px);
  border: 1px solid var(--glass-border);
  box-shadow: 0 30px 60px rgba(0,0,0,0.45);
}

h2 {
  margin-top: 0;
  font-size: 1.25rem;
}

/* =========================
   Controls
========================= */
.control {
  margin-bottom: 14px;
}

label {
  font-size: 0.75rem;
  opacity: 0.85;
}

select,
input[type="range"],
input[type="number"] {
  width: 100%;
  margin-top: 6px;
  padding: 6px;
  border-radius: 10px;
  border: none;
}

/* =========================
   Playground
========================= */
.playground {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.flex-area {
  min-height: 260px;
  padding: 16px;
  border-radius: 18px;
  background: rgba(255,255,255,0.12);
  border: 1px dashed var(--glass-border);
  display: flex;
  gap: 12px;
}

.item {
  width: 60px;
  height: 60px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #020617;
}

/* =========================
   CSS Output
========================= */
pre {
  background: rgba(0,0,0,0.45);
  padding: 14px;
  border-radius: 14px;
  overflow-x: auto;
  font-size: 0.85rem;
}

/* =========================
   Buttons
========================= */
.actions {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #020617;
}
</style>
</head>

<body>

<div class="app">

  <!-- LEFT: CONTROLS -->
  <div class="panel">
    <h2>⚙ Flexbox Controls</h2>

    <div class="control">
      <label>flex-direction</label>
      <select id="direction">
        <option>row</option>
        <option>row-reverse</option>
        <option>column</option>
        <option>column-reverse</option>
      </select>
    </div>

    <div class="control">
      <label>justify-content</label>
      <select id="justify">
        <option>flex-start</option>
        <option>center</option>
        <option>flex-end</option>
        <option>space-between</option>
        <option>space-around</option>
        <option>space-evenly</option>
      </select>
    </div>

    <div class="control">
      <label>align-items</label>
      <select id="align">
        <option>stretch</option>
        <option>flex-start</option>
        <option>center</option>
        <option>flex-end</option>
        <option>baseline</option>
      </select>
    </div>

    <div class="control">
      <label>flex-wrap</label>
      <select id="wrap">
        <option>nowrap</option>
        <option>wrap</option>
        <option>wrap-reverse</option>
      </select>
    </div>

    <div class="control">
      <label>gap</label>
      <input type="range" id="gap" min="0" max="40" value="12">
    </div>

    <div class="control">
      <label>Number of items</label>
      <input type="number" id="count" min="1" max="12" value="5">
    </div>
  </div>

  <!-- RIGHT: PREVIEW -->
  <div class="panel playground">
    <h2>👀 Live Preview</h2>

    <div class="flex-area" id="flex">
      <!-- items injected -->
    </div>

    <h2>📄 CSS Output</h2>
    <pre id="cssOutput"></pre>

    <div class="actions">
      <button onclick="copyCSS()">Copy CSS</button>
    </div>
  </div>

</div>

<script>
const flex = document.getElementById("flex");
const cssOutput = document.getElementById("cssOutput");

function buildItems() {
  flex.innerHTML = "";
  for (let i = 1; i <= count.value; i++) {
    const d = document.createElement("div");
    d.className = "item";
    d.textContent = i;
    flex.appendChild(d);
  }
}

function update() {
  flex.style.flexDirection = direction.value;
  flex.style.justifyContent = justify.value;
  flex.style.alignItems = align.value;
  flex.style.flexWrap = wrap.value;
  flex.style.gap = gap.value + "px";

  cssOutput.textContent = `
display: flex;
flex-direction: ${direction.value};
justify-content: ${justify.value};
align-items: ${align.value};
flex-wrap: ${wrap.value};
gap: ${gap.value}px;
`.trim();
}

function copyCSS() {
  navigator.clipboard.writeText(cssOutput.textContent);
}

document.querySelectorAll("select, input").forEach(el =>
  el.addEventListener("input", () => {
    buildItems();
    update();
  })
);

buildItems();
update();
</script>

</body>
</html>
