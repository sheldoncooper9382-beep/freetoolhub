<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Transition Generator – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --glass-bg: rgba(255,255,255,0.14);
  --glass-border: rgba(255,255,255,0.28);
  --accent: #7dd3fc;
  --accent2: #a855f7;
  --text: #f8fafc;
}

/* -----------------------------
   Base Styles
----------------------------- */
* {
  box-sizing: border-box;
  font-family: system-ui, Segoe UI, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top left, #1e293b, #020617);
  color: var(--text);
}

/* -----------------------------
   Layout
----------------------------- */
.app {
  width: 1100px;
  max-width: 96%;
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 22px;
}

/* -----------------------------
   Glass Panels
----------------------------- */
.panel {
  padding: 24px;
  border-radius: 22px;
  background: linear-gradient(
    145deg,
    rgba(255,255,255,0.22),
    rgba(255,255,255,0.06)
  );
  backdrop-filter: blur(22px);
  border: 1px solid var(--glass-border);
  box-shadow: 0 30px 60px rgba(0,0,0,0.45);
}

h2 {
  margin-top: 0;
  font-size: 1.25rem;
}

/* -----------------------------
   Controls
----------------------------- */
.control {
  margin-bottom: 14px;
}

label {
  font-size: 0.75rem;
  opacity: 0.85;
}

select,
input[type="range"],
input[type="number"] {
  width: 100%;
  margin-top: 6px;
}

/* -----------------------------
   Preview Area
----------------------------- */
.preview-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
}

.preview-bg {
  width: 100%;
  padding: 80px;
  border-radius: 22px;
  background: rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
}

.preview-box {
  width: 200px;
  height: 70px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  letter-spacing: 0.4px;
  color: #020617;
  cursor: pointer;
}

/* Hover effect using generated classes */
.preview-box.preview-hover {
  transform: translateY(var(--lift, 0px));
  box-shadow: 0 var(--shadow, 10px) calc(var(--shadow, 10px)*2) rgba(0,0,0,0.4);
  transition: var(--transition, all 0.3s ease);
}

/* -----------------------------
   Output
----------------------------- */
pre {
  width: 100%;
  background: rgba(0,0,0,0.45);
  padding: 14px;
  border-radius: 14px;
  overflow-x: auto;
  font-size: 0.85rem;
}

/* -----------------------------
   Buttons
----------------------------- */
.actions {
  display: flex;
  gap: 12px;
}

button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #020617;
}
</style>
</head>

<body>

<div class="app">

  <!-- LEFT PANEL -->
  <div class="panel">
    <h2>🎛 Transition Controls</h2>

    <div class="control">
      <label>Property</label>
      <select id="property">
        <option value="all">all</option>
        <option value="transform">transform</option>
        <option value="background">background</option>
        <option value="box-shadow">box-shadow</option>
        <option value="opacity">opacity</option>
      </select>
    </div>

    <div class="control">
      <label>Duration (s)</label>
      <input type="range" id="duration" min="0.1" max="2" step="0.05" value="0.3">
    </div>

    <div class="control">
      <label>Delay (s)</label>
      <input type="range" id="delay" min="0" max="1" step="0.05" value="0">
    </div>

    <div class="control">
      <label>Timing Function</label>
      <select id="easing">
        <option>ease</option>
        <option>ease-in</option>
        <option>ease-out</option>
        <option>ease-in-out</option>
        <option>linear</option>
        <option>cubic-bezier(0.4,0,0.2,1)</option>
      </select>
    </div>

    <div class="control">
      <label>Hover Elevation (px)</label>
      <input type="range" id="lift" min="0" max="20" value="10">
    </div>

    <div class="control">
      <label>Hover Shadow Strength</label>
      <input type="range" id="shadow" min="0" max="40" value="25">
    </div>

    <div class="actions">
      <button id="generateBtn">Generate Preview</button>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel preview-wrap">
    <h2>👀 Hover Preview</h2>

    <div class="preview-bg">
      <div class="preview-box" id="box">Hover Me</div>
    </div>

    <h2>📄 CSS Output</h2>
    <pre id="cssOutput"></pre>

    <div class="actions">
      <button onclick="copyCSS()">Copy CSS</button>
      <button onclick="copyHTML()">Copy HTML + Inline CSS</button>
    </div>
  </div>

</div>

<script>
const box = document.getElementById("box");
const cssOutput = document.getElementById("cssOutput");
const generateBtn = document.getElementById("generateBtn");

function generatePreview() {
  const prop = property.value;
  const dur = duration.value;
  const del = delay.value;
  const ease = easing.value;
  const liftVal = lift.value;
  const shadowVal = shadow.value;

  // Apply CSS variables to preview
  box.style.setProperty("--lift", `-${liftVal}px`);
  box.style.setProperty("--shadow", `${shadowVal}px`);
  box.style.setProperty("--transition", `${prop} ${dur}s ${ease} ${del}s`);

  // Add preview-hover class to simulate hover
  box.classList.add("preview-hover");

  // Remove hover after 2s for demo reset
  setTimeout(() => box.classList.remove("preview-hover"), (dur*1000)+100);
  
  // Update CSS Output
  cssOutput.textContent = `
.element {
  transition: ${prop} ${dur}s ${ease} ${del}s;
}

.element:hover {
  transform: translateY(-${liftVal}px);
  box-shadow: 0 ${shadowVal}px ${shadowVal*2}px rgba(0,0,0,0.4);
}
`.trim();
}

// Copy functions
function copyCSS() {
  navigator.clipboard.writeText(cssOutput.textContent);
}

function copyHTML() {
  navigator.clipboard.writeText(
    `<div style="transition: ${property.value} ${duration.value}s ${easing.value} ${delay.value}s; transform: translateY(-${lift.value}px); box-shadow: 0 ${shadow.value}px ${shadow.value*2}px rgba(0,0,0,0.4);">Hover Me</div>`
  );
}

// Event listeners
generateBtn.addEventListener("click", generatePreview);
document.querySelectorAll("input, select").forEach(el =>
  el.addEventListener("input", () => {
    // Optional live updates of CSS output without preview
    const prop = property.value;
    const dur = duration.value;
    const del = delay.value;
    const ease = easing.value;
    const liftVal = lift.value;
    const shadowVal = shadow.value;

    cssOutput.textContent = `
.element {
  transition: ${prop} ${dur}s ${ease} ${del}s;
}

.element:hover {
  transform: translateY(-${liftVal}px);
  box-shadow: 0 ${shadowVal}px ${shadowVal*2}px rgba(0,0,0,0.4);
}
`.trim();
  })
);
</script>

</body>
</html>
