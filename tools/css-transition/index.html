<script>
const box = document.getElementById("box");
const cssOutput = document.getElementById("cssOutput");

function update() {
  const prop = property.value;
  const dur = duration.value;
  const del = delay.value;
  const ease = easing.value;
  const liftVal = lift.value;
  const shadowVal = shadow.value;

  /* Live CSS variables for preview */
  box.style.setProperty("--lift", `${liftVal}px`);
  box.style.setProperty("--shadow", `${shadowVal}px`);
  box.style.setProperty("--transition", `${prop} ${dur}s ${ease} ${del}s`);

  /* Output */
  cssOutput.textContent = `
.element {
  transition: ${prop} ${dur}s ${ease} ${del}s;
}

.element:hover {
  transform: translateY(-${liftVal}px);
  box-shadow: 0 ${shadowVal}px ${shadowVal * 2}px rgba(0,0,0,0.4);
}
`.trim();
}

/* Optional mobile preview toggle */
box.addEventListener("click", () => {
  box.classList.toggle("hover");
});

document.querySelectorAll("input, select").forEach(el =>
  el.addEventListener("input", update)
);

update();
</script>
