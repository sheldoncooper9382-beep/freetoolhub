<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SVG Optimizer – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --glass-bg: rgba(255,255,255,0.14);
  --glass-border: rgba(255,255,255,0.28);
  --accent: #7dd3fc;
  --accent2: #a855f7;
  --text: #f8fafc;
}

* {
  box-sizing: border-box;
  font-family: system-ui, Segoe UI, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top left, #1e293b, #020617);
  color: var(--text);
}

/* Layout */
.app {
  width: 1100px;
  max-width: 96%;
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 22px;
}

/* Glass Panels */
.panel {
  padding: 24px;
  border-radius: 22px;
  background: linear-gradient(145deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06));
  backdrop-filter: blur(22px);
  border: 1px solid var(--glass-border);
  box-shadow: 0 30px 60px rgba(0,0,0,0.45);
}

h2 {
  margin-top: 0;
  font-size: 1.25rem;
}

/* Controls */
textarea {
  width: 100%;
  min-height: 120px;
  padding: 12px;
  border-radius: 14px;
  border: none;
  outline: none;
  resize: vertical;
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-family: monospace;
}

.actions {
  display: flex;
  gap: 12px;
  margin-top: 10px;
}

button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #020617;
}

/* Preview */
.preview-bg {
  width: 100%;
  padding: 80px;
  border-radius: 22px;
  background: rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
}

.preview-bg svg {
  max-width: 100%;
  max-height: 100%;
}
</style>
</head>

<body>
<div class="app">

  <!-- LEFT PANEL -->
  <div class="panel">
    <h2>🛠 SVG Input</h2>
    <textarea id="inputSVG" placeholder="Paste your SVG code here"></textarea>
    <div class="actions">
      <button id="optimizeBtn">Optimize SVG</button>
      <button onclick="copyOptimized()">Copy Optimized</button>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel">
    <h2>👀 Live Preview</h2>
    <div class="preview-bg" id="preview"></div>
    <h2>📄 Optimized SVG</h2>
    <textarea id="outputSVG" readonly></textarea>
  </div>

</div>

<script>
// Utilities to optimize SVG
function optimizeSVG(svg) {
  // Remove XML comments
  svg = svg.replace(/<!--[\s\S]*?-->/g, '');
  // Remove unnecessary spaces and newlines
  svg = svg.replace(/\s+/g, ' ').trim();
  // Remove redundant IDs, metadata
  svg = svg.replace(/ id="[^"]+"/g, '');
  svg = svg.replace(/<metadata>.*?<\/metadata>/g, '');
  svg = svg.replace(/<title>.*?<\/title>/g, '');
  svg = svg.replace(/<desc>.*?<\/desc>/g, '');
  // Remove empty groups
  svg = svg.replace(/<g>\s*<\/g>/g, '');
  return svg;
}

// DOM Elements
const inputSVG = document.getElementById("inputSVG");
const outputSVG = document.getElementById("outputSVG");
const preview = document.getElementById("preview");
const optimizeBtn = document.getElementById("optimizeBtn");

// Optimize button
optimizeBtn.addEventListener("click", () => {
  const raw = inputSVG.value;
  const optimized = optimizeSVG(raw);
  outputSVG.value = optimized;

  // Update live preview
  preview.innerHTML = '';
  try {
    const parser = new DOMParser();
    const svgDoc = parser.parseFromString(optimized, "image/svg+xml");
    preview.appendChild(svgDoc.documentElement);
  } catch(e) {
    preview.textContent = "Invalid SVG!";
  }
});

// Copy function
function copyOptimized() {
  navigator.clipboard.writeText(outputSVG.value);
}
</script>

</body>
</html>
