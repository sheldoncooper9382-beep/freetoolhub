<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clipboard Copy Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #1e293b, #020617);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f8fafc;
  }

  .glass-card {
    width: 420px;
    padding: 24px;
    border-radius: 18px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 10px 40px rgba(0,0,0,0.45);
  }

  h1 {
    margin: 0 0 6px 0;
    text-align: center;
  }

  p {
    text-align: center;
    font-size: 0.9rem;
    opacity: 0.8;
    margin-bottom: 18px;
  }

  textarea {
    width: 100%;
    height: 110px;
    resize: none;
    padding: 12px;
    border-radius: 12px;
    border: none;
    outline: none;
    background: rgba(0,0,0,0.4);
    color: #f8fafc;
    font-size: 14px;
  }

  .actions {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 14px;
  }

  button {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
    background: linear-gradient(135deg, #38bdf8, #3b82f6);
    color: #020617;
  }

  button.secondary {
    background: rgba(255,255,255,0.15);
    color: #f8fafc;
  }

  .status {
    text-align: center;
    margin-top: 12px;
    font-size: 0.9rem;
    min-height: 1em;
  }

  .copied {
    color: #22c55e;
  }

  .error {
    color: #ef4444;
  }
</style>
</head>

<body>

<div class="glass-card">
  <h1>📋 Clipboard Copy</h1>
  <p>Paste text below and copy it instantly.</p>

  <textarea id="text" placeholder="Enter text, code, or hex value..."></textarea>

  <div class="actions">
    <button id="copyBtn">Copy</button>
    <button id="clearBtn" class="secondary">Clear</button>
  </div>

  <div id="status" class="status"></div>
</div>

<script>
  const textArea = document.getElementById('text');
  const copyBtn = document.getElementById('copyBtn');
  const clearBtn = document.getElementById('clearBtn');
  const status = document.getElementById('status');

  function showStatus(message, type = '') {
    status.textContent = message;
    status.className = `status ${type}`;
    setTimeout(() => status.textContent = '', 1500);
  }

  copyBtn.addEventListener('click', async () => {
    if (!textArea.value.trim()) {
      showStatus('Nothing to copy', 'error');
      return;
    }

    try {
      await navigator.clipboard.writeText(textArea.value);
      showStatus('✓ Copied to clipboard', 'copied');
    } catch {
      showStatus('Copy failed', 'error');
    }
  });

  clearBtn.addEventListener('click', () => {
    textArea.value = '';
    textArea.focus();
  });

  // Keyboard shortcut: Ctrl / Cmd + C when focused
  textArea.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
      showStatus('Use Copy button for clipboard access');
    }
  });
</script>

</body>
</html>
