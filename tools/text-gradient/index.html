<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Gradient Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Text Gradient Generator</h1>

  <div class="generator">

    <!-- Preview -->
    <div class="preview">
      <div id="gradientText">Gradient Text</div>
    </div>

    <!-- Controls -->
    <div class="controls">

      <label>Text</label>
      <input type="text" id="textInput" value="Gradient Text">

      <label>Font Size (px)</label>
      <input type="range" id="fontSize" min="20" max="120" value="64">

      <label>Font Weight</label>
      <input type="range" id="fontWeight" min="100" max="900" step="100" value="600">

      <label>
        <input type="checkbox" id="italic"> Italic
      </label>

      <label>Gradient Direction</label>
      <select id="direction">
        <option value="to right">Left to Right</option>
        <option value="to left">Right to Left</option>
        <option value="to bottom">Top to Bottom</option>
        <option value="to top">Bottom to Top</option>
        <option value="45deg">45°</option>
        <option value="135deg">135°</option>
      </select>

      <label>Colors</label>
      <div class="colors">
        <input type="color" value="#ff6ec4">
        <input type="color" value="#7873f5">
        <input type="color" value="#4ade80">
      </div>

      <div class="buttons">
        <button onclick="addColor()">Add Color</button>
        <button onclick="removeColor()">Remove Color</button>
      </div>

      <button class="copy" onclick="copyCSS()">Copy CSS</button>
      <button class="reset" onclick="resetAll()">Reset</button>

      <textarea id="cssOutput" readonly></textarea>

    </div>

  </div>
</div>

<script src="main.js"></script>
</body>
</html>
