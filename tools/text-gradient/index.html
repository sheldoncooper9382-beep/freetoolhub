<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Text Gradient Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1 class="title">Text Gradient Generator</h1>

  <div class="app">

    <!-- PREVIEW -->
    <div class="preview-card">
      <span id="previewText">Gradient Text</span>
    </div>

    <!-- CONTROLS -->
    <div class="controls">

      <div class="control">
        <label>Text</label>
        <input type="text" id="textInput" value="Gradient Text" />
      </div>

      <div class="control">
        <label>Font Size</label>
        <input type="range" id="fontSize" min="24" max="140" value="90" />
      </div>

      <div class="control">
        <label>Font Weight</label>
        <input type="range" id="fontWeight" min="200" max="900" step="100" value="800" />
      </div>

      <div class="control checkbox">
        <label>
          <input type="checkbox" id="italicToggle" />
          Italic
        </label>
      </div>

      <div class="control">
        <label>Gradient Direction</label>
        <select id="direction">
          <option value="to right">Left to Right</option>
          <option value="to left">Right to Left</option>
          <option value="to bottom">Top to Bottom</option>
          <option value="45deg">Diagonal</option>
        </select>
      </div>

      <div class="control">
        <label>Colors</label>
        <div id="colorList" class="colors">
          <input type="color" value="#ff77c6">
          <input type="color" value="#8b7cff">
          <input type="color" value="#4ade80">
        </div>
      </div>

      <div class="buttons">
        <button id="addColor">Add Color</button>
        <button id="removeColor">Remove Color</button>
        <button id="copyCSS" class="primary">Copy CSS</button>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
