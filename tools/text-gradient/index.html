<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text Gradient Generator – FreeToolHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===========================
   FreeToolHub Glass Theme
=========================== */
:root {
  --glass-bg: rgba(255,255,255,0.12);
  --glass-border: rgba(255,255,255,0.25);
  --glass-highlight: rgba(255,255,255,0.35);
  --accent: #7dd3fc;
  --accent-2: #a855f7;
  --text: #f8fafc;
  --shadow: 0 30px 60px rgba(0,0,0,0.45);
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", system-ui, sans-serif;
}

body {
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at top left, #1e293b, #020617),
    url("https://grainy-gradients.vercel.app/noise.svg");
  color: var(--text);
}

/* ===========================
   Main Glass Card
=========================== */
.glass {
  width: 520px;
  padding: 30px;
  border-radius: 22px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.18),
      rgba(255,255,255,0.05)
    );
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow);
}

/* ===========================
   Typography
=========================== */
h1 {
  text-align: center;
  margin: 0 0 18px;
  font-size: 1.6rem;
  font-weight: 700;
}

/* ===========================
   Inputs
=========================== */
textarea {
  width: 100%;
  min-height: 80px;
  padding: 14px;
  border-radius: 16px;
  border: 1px solid var(--glass-border);
  background: rgba(255,255,255,0.18);
  color: white;
  resize: vertical;
  outline: none;
}

textarea::placeholder {
  color: rgba(255,255,255,0.6);
}

/* ===========================
   Controls Grid
=========================== */
.controls {
  margin-top: 18px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.control {
  padding: 12px;
  border-radius: 16px;
  background: rgba(255,255,255,0.16);
  border: 1px solid var(--glass-border);
}

label {
  font-size: 0.75rem;
  letter-spacing: 0.03em;
  opacity: 0.85;
}

/* ===========================
   Form Elements
=========================== */
input[type="color"],
input[type="range"],
select {
  width: 100%;
  margin-top: 8px;
  background: transparent;
  border: none;
  color: white;
  cursor: pointer;
}

/* Slider Glow */
input[type="range"] {
  accent-color: var(--accent);
}

/* Select Styling */
select {
  padding: 6px;
  border-radius: 10px;
  background: rgba(255,255,255,0.2);
}

/* ===========================
   Preview
=========================== */
.preview {
  margin-top: 22px;
  padding: 20px;
  border-radius: 18px;
  background: rgba(255,255,255,0.15);
  border: 1px solid var(--glass-border);
  text-align: center;
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: 0.03em;
  word-break: break-word;
}

/* ===========================
   Actions
=========================== */
.actions {
  margin-top: 20px;
  display: flex;
  gap: 12px;
}

button {
  flex: 1;
  padding: 14px;
  border-radius: 18px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #020617;
  box-shadow: 0 10px 25px rgba(0,0,0,0.35);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 30px rgba(0,0,0,0.45);
}

button.secondary {
  background: rgba(255,255,255,0.75);
  color: #020617;
}
</style>
</head>

<body>

<div class="glass">
  <h1>🌈 Text Gradient Generator</h1>

  <textarea id="textInput">FreeToolHub</textarea>

  <div class="controls">
    <div class="control">
      <label>Gradient Type</label>
      <select id="type">
        <option value="linear">Linear</option>
        <option value="radial">Radial</option>
      </select>
    </div>

    <div class="control">
      <label>Angle (Linear)</label>
      <input type="range" id="angle" min="0" max="360" value="90">
    </div>

    <div class="control">
      <label>Color 1</label>
      <input type="color" id="c1" value="#22d3ee">
    </div>

    <div class="control">
      <label>Color 2</label>
      <input type="color" id="c2" value="#a855f7">
    </div>
  </div>

  <div class="preview" id="preview">FreeToolHub</div>

  <div class="actions">
    <button onclick="copyCSS()">Copy CSS</button>
    <button class="secondary" onclick="copyHTML()">Copy HTML</button>
  </div>
</div>

<script>
const textInput = document.getElementById("textInput");
const preview = document.getElementById("preview");
const type = document.getElementById("type");
const angle = document.getElementById("angle");
const c1 = document.getElementById("c1");
const c2 = document.getElementById("c2");

function update() {
  const gradient =
    type.value === "linear"
      ? `linear-gradient(${angle.value}deg, ${c1.value}, ${c2.value})`
      : `radial-gradient(circle, ${c1.value}, ${c2.value})`;

  preview.textContent = textInput.value || "";
  preview.style.background = gradient;
  preview.style.webkitBackgroundClip = "text";
  preview.style.backgroundClip = "text";
  preview.style.color = "transparent";
}

function copyCSS() {
  navigator.clipboard.writeText(`
background: ${preview.style.background};
-webkit-background-clip: text;
background-clip: text;
color: transparent;
`.trim());
}

function copyHTML() {
  navigator.clipboard.writeText(
    `<span style="${preview.style.cssText}">${preview.textContent}</span>`
  );
}

document.querySelectorAll("input, select, textarea")
  .forEach(el => el.addEventListener("input", update));

update();
</script>

</body>
</html>
