<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TextStudio API Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>TextStudio API Text Generator</h1>

  <!-- Glassmorphic Preview -->
  <div class="preview-panel">
    <img id="previewImage" src="" alt="Generated Text Preview">
    <div id="loading" class="loading">Generating...</div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <label>Enter Text</label>
    <input type="text" id="textInput" value="Hello World!">

    <label>Style ID (preset or user style)</label>
    <input type="text" id="styleId" value="261">

    <label>Background</label>
    <select id="background">
      <option value="opaque">Opaque</option>
      <option value="transparent">Transparent</option>
    </select>

    <label>Padding (%)</label>
    <input type="number" id="padding" value="5" min="0" max="50">

    <label>Quality</label>
    <select id="quality">
      <option value="lite">Lite (768px)</option>
      <option value="pro">Pro (2048px)</option>
      <option value="ultra">Ultra (4096px)</option>
    </select>

    <label>Format</label>
    <select id="format">
      <option value="png">PNG</option>
      <option value="webp">WEBP</option>
      <option value="jpg">JPG</option>
    </select>

    <label>Aspect Ratio</label>
    <select id="aspectRatio">
      <option value="fit">Fit</option>
      <option value="1:1">1:1</option>
      <option value="16:9">16:9</option>
    </select>

    <button id="generateBtn">Generate Image</button>
    <button id="downloadBtn">Download Image</button>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
