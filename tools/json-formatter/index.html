<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JSON Formatter, Validator & Auto-Fix Tool</title>

<meta name="description" content="Free JSON Formatter with auto-fix, syntax highlighting, tree view, diff viewer, error highlighting, dark/light mode, and download support.">
<meta name="keywords" content="json formatter, json validator, json auto fix, json tree viewer, json diff tool">
<meta name="robots" content="index, follow">

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">
    <header>
        <h1>JSON Formatter</h1>
        <button class="toggle" onclick="toggleTheme()">🌗</button>
    </header>

    <div class="editor-wrapper">
        <div class="line-numbers" id="lines">1</div>
        <textarea id="jsonInput" placeholder="Paste JSON here..."></textarea>
    </div>

    <div class="buttons">
        <button onclick="formatJSON()">Format</button>
        <button onclick="minifyJSON()">Minify</button>
        <button onclick="autoFixJSON()">Auto-Fix</button>
        <button onclick="undoFix()">Undo</button>
        <button onclick="renderTree()">Tree View</button>
        <button onclick="copyJSON()">Copy</button>
        <button onclick="downloadJSON()">Download</button>
        <button onclick="toggleDiff()">Show Diff</button>
    </div>

    <div class="message" id="message"></div>
    <div class="confidence" id="confidence"></div>

    <pre id="highlighted"></pre>

    <div class="diff" id="diff">
        <div>
            <h3>Before</h3>
            <pre id="diffBefore"></pre>
        </div>
        <div>
            <h3>After</h3>
            <pre id="diffAfter"></pre>
        </div>
    </div>

    <div id="tree"></div>
</div>

<script src="script.js"></script>
</body>
</html>
