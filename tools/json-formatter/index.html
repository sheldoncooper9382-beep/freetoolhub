<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter & Auto-Fix Tool</title>
<meta name="description" content="Format, validate, minify, and auto-fix JSON with a modern frosted glass UI.">

<style>
/* =========================
   ROOT / THEME VARIABLES
========================= */
:root {
  --bg-gradient:
    radial-gradient(circle at 10% 10%, #60a5fa33, transparent 40%),
    radial-gradient(circle at 90% 90%, #c084fc33, transparent 45%),
    linear-gradient(135deg, #020617, #0f172a);

  --glass-bg: rgba(255,255,255,0.08);
  --glass-strong: rgba(255,255,255,0.14);
  --glass-border: rgba(255,255,255,0.28);

  --blur-strong: blur(22px);
  --blur-soft: blur(14px);

  --text-main: #e5e7eb;
  --text-muted: #94a3b8;

  --accent-blue: #60a5fa;
  --accent-green: #34d399;
  --accent-purple: #c084fc;
  --accent-red: #fb7185;

  --shadow: 0 25px 60px rgba(0,0,0,.55);
}

/* =========================
   BASE RESET
========================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  background: var(--bg-gradient);
  color: var(--text-main);
  padding: 24px;
}

/* =========================
   LAYOUT
========================= */
.container {
  max-width: 1400px;
  margin: auto;
  display: grid;
  gap: 24px;
}

header {
  text-align: center;
  padding: 32px;
  background: var(--glass-strong);
  backdrop-filter: var(--blur-strong);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  box-shadow: var(--shadow);
}

header h1 {
  font-size: 2.4rem;
  background: linear-gradient(90deg,var(--accent-blue),var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

header p {
  margin-top: 10px;
  color: var(--text-muted);
}

main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
}

/* =========================
   GLASS PANELS
========================= */
.panel {
  background: var(--glass-bg);
  backdrop-filter: var(--blur-soft);
  border: 1px solid var(--glass-border);
  border-radius: 22px;
  padding: 18px;
  box-shadow: var(--shadow);
}

/* =========================
   TOOLBAR
========================= */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
}

button {
  background: rgba(255,255,255,0.12);
  border: 1px solid var(--glass-border);
  color: var(--text-main);
  padding: 10px 14px;
  border-radius: 14px;
  cursor: pointer;
  font-weight: 600;
  transition: .25s ease;
  backdrop-filter: var(--blur-soft);
}

button:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,0.18);
}

.primary { color: var(--accent-blue); }
.success { color: var(--accent-green); }
.warn { color: #fbbf24; }

/* =========================
   EDITOR
========================= */
.editor {
  display: flex;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid var(--glass-border);
  background: rgba(0,0,0,0.25);
}

.lines {
  padding: 14px 8px;
  text-align: right;
  font-family: monospace;
  font-size: .9rem;
  color: #94a3b8;
  user-select: none;
}

textarea {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-main);
  padding: 14px;
  font-family: monospace;
  font-size: .95rem;
  resize: vertical;
  outline: none;
}

/* =========================
   STATUS
========================= */
.status {
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
  font-size: .9rem;
  color: var(--text-muted);
}

/* =========================
   TABS
========================= */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: 12px;
  cursor: pointer;
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--glass-border);
}

.tab.active {
  background: rgba(96,165,250,0.25);
  color: var(--accent-blue);
}

.output {
  display: none;
}

.output.active {
  display: block;
}

pre {
  max-height: 420px;
  overflow: auto;
  background: rgba(0,0,0,0.25);
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--glass-border);
  font-family: monospace;
}

/* =========================
   DIFF
========================= */
.diff {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

@media (max-width: 700px) {
  .diff { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>JSON Formatter & Auto-Fix Tool</h1>
  <p>Validate, format, minify, and repair JSON instantly</p>
</header>

<main>

<!-- LEFT -->
<section class="panel">
  <div class="toolbar">
    <button class="primary" onclick="formatJSON()">Format</button>
    <button onclick="minifyJSON()">Minify</button>
    <button onclick="validateJSON()">Validate</button>
    <button class="success" onclick="autoFix()">Auto-Fix</button>
    <button onclick="undoFix()">Undo</button>
  </div>

  <div class="editor">
    <div class="lines" id="lines">1</div>
    <textarea id="input" placeholder='Paste JSON here...'></textarea>
  </div>

  <div class="status">
    <span id="status">Ready</span>
    <span id="confidence">Confidence: -%</span>
  </div>
</section>

<!-- RIGHT -->
<section class="panel">
  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)">Formatted</div>
    <div class="tab" onclick="switchTab(1)">Tree</div>
    <div class="tab" onclick="switchTab(2)">Diff</div>
  </div>

  <div id="out0" class="output active">
    <pre id="formatted">Formatted JSON will appear here</pre>
  </div>

  <div id="out1" class="output">
    <pre id="tree">Tree view will appear here</pre>
  </div>

  <div id="out2" class="output">
    <div class="diff">
      <pre id="before">Before</pre>
      <pre id="after">After</pre>
    </div>
  </div>
</section>

</main>
</div>

<script>
const input = document.getElementById("input");
const lines = document.getElementById("lines");
const formatted = document.getElementById("formatted");
const tree = document.getElementById("tree");
const before = document.getElementById("before");
const after = document.getElementById("after");
const status = document.getElementById("status");
const confidence = document.getElementById("confidence");

let original = "";

input.addEventListener("input", () => {
  lines.textContent = input.value.split("\n").map((_,i)=>i+1).join("\n");
});

function switchTab(i){
  document.querySelectorAll(".tab").forEach((t,n)=>t.classList.toggle("active",n===i));
  document.querySelectorAll(".output").forEach((o,n)=>o.classList.toggle("active",n===i));
}

function formatJSON(){
  try{
    const obj = JSON.parse(input.value);
    const out = JSON.stringify(obj,null,2);
    formatted.textContent = out;
    tree.textContent = JSON.stringify(obj,null,2);
    status.textContent = "Formatted successfully";
  }catch(e){
    status.textContent = e.message;
  }
}

function minifyJSON(){
  try{
    const obj = JSON.parse(input.value);
    input.value = JSON.stringify(obj);
    formatJSON();
  }catch(e){ status.textContent = e.message; }
}

function validateJSON(){
  try{
    JSON.parse(input.value);
    status.textContent = "Valid JSON";
  }catch(e){ status.textContent = "Invalid JSON"; }
}

function autoFix(){
  original = input.value;
  before.textContent = original;
  let fixed = original
    .replace(/'/g,'"')
    .replace(/,\s*([}\]])/g,"$1");
  try{
    const obj = JSON.parse(fixed);
    input.value = JSON.stringify(obj,null,2);
    after.textContent = input.value;
    confidence.textContent = "Confidence: 80%";
    status.textContent = "Auto-fix applied";
  }catch(e){
    status.textContent = "Auto-fix failed";
  }
}

function undoFix(){
  input.value = original;
  status.textContent = "Reverted";
}
</script>

</body>
</html>
