<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-container">
    <div class="calculator">
      <div id="screen" class="screen">0</div>
      <div class="buttons">
        <!-- Row 1 -->
        <button class="btn func" data-action="MC">MC</button>
        <button class="btn func" data-action="MR">MR</button>
        <button class="btn func" data-action="M+">M+</button>
        <button class="btn func" data-action="M-">M-</button>
        <button class="btn func" data-action="C">C</button>

        <!-- Row 2 -->
        <button class="btn func" data-action="(">(</button>
        <button class="btn func" data-action=")">)</button>
        <button class="btn func" data-action="pi">π</button>
        <button class="btn func" data-action="e">e</button>
        <button class="btn op" data-action="÷">÷</button>

        <!-- Row 3 -->
        <button class="btn num" data-action="7">7</button>
        <button class="btn num" data-action="8">8</button>
        <button class="btn num" data-action="9">9</button>
        <button class="btn func" data-action="sqrt">√</button>
        <button class="btn op" data-action="×">×</button>

        <!-- Row 4 -->
        <button class="btn num" data-action="4">4</button>
        <button class="btn num" data-action="5">5</button>
        <button class="btn num" data-action="6">6</button>
        <button class="btn func" data-action="pow">^</button>
        <button class="btn op" data-action="-">-</button>

        <!-- Row 5 -->
        <button class="btn num" data-action="1">1</button>
        <button class="btn num" data-action="2">2</button>
        <button class="btn num" data-action="3">3</button>
        <button class="btn func" data-action="!">x!</button>
        <button class="btn op" data-action="+">+</button>

        <!-- Row 6 -->
        <button class="btn num" data-action="0">0</button>
        <button class="btn num" data-action=".">.</button>
        <button class="btn func" data-action="sin">sin</button>
        <button class="btn func" data-action="cos">cos</button>
        <button class="btn func" data-action="tan">tan</button>

        <!-- Row 7 -->
        <button class="btn func" data-action="asin">asin</button>
        <button class="btn func" data-action="acos">acos</button>
        <button class="btn func" data-action="atan">atan</button>
        <button class="btn func" data-action="log">log</button>
        <button class="btn func" data-action="ln">ln</button>

        <!-- Row 8 -->
        <button class="btn func" data-action="exp">exp</button>
        <button class="btn op" data-action="=">=</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
